<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumen · Théologie catholique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   LUMEN — feuille de style
   Palette « manuscrit nocturne » : encre profonde, parchemin, or ancien.
   ============================================================ */
:root{
  --encre:#000000;          /* fond global, noir total */
  --encre-2:#0b0b0b;        /* fond des surfaces légèrement levées */
  --parchemin:#ffffff;      /* texte principal, blanc franc */
  --parchemin-att:#ffffff;  /* texte secondaire, blanc lui aussi */
  --or:#efe6cf;             /* accent principal, crème clair */
  --or-pale:#f8f3e6;        /* crème éclairci, hover */
  --pourpre:#9a3b3b;        /* accent rare, rouge liturgique */
  --filet:rgba(231,224,207,.14); /* filets fins */
  --filet-fort:rgba(231,224,207,.28);
}

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--encre);
  color:var(--parchemin);
  font-family:'EB Garamond',Georgia,serif;
  font-size:23px;
  line-height:1.75;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
::selection{background:rgba(198,164,92,.25)}
::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-track{background:var(--encre)}
::-webkit-scrollbar-thumb{background:rgba(231,224,207,.35)}
::-webkit-scrollbar-thumb:hover{background:rgba(231,224,207,.6)}
html{scrollbar-color:rgba(231,224,207,.35) var(--encre)}

a{color:inherit;text-decoration:none}

/* ---------- bandeau d'en-tête ---------- */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(0,0,0,.82);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--filet);
}
.barre{
  max-width:1080px;margin:0 auto;
  padding:20px 32px;
  display:grid;grid-template-columns:auto auto 1fr;align-items:center;
  gap:24px;
}
.logo{
  grid-column:1;grid-row:1;
  font-family:'Cormorant Garamond',serif;
  font-weight:500;font-size:26px;
  letter-spacing:.34em;
  text-transform:uppercase;
  color:var(--parchemin);
  padding-left:.34em;
}
.logo:hover{color:var(--or-pale)}
nav.menu{display:flex;gap:30px;grid-column:3;grid-row:1;justify-self:end;align-items:center}
nav.menu a{
  font-family:'Cormorant Garamond',serif;
  font-size:16px;letter-spacing:.12em;
  text-transform:uppercase;
  white-space:nowrap;
  color:var(--parchemin-att);
  padding-bottom:3px;
  border-bottom:1px solid transparent;
  transition:color .3s,border-color .3s;
}
nav.menu a:hover,nav.menu a.actif{color:var(--parchemin);border-color:var(--or)}

/* bouton menu mobile */
.burger{display:none;background:none;border:none;color:var(--parchemin);
  font-size:24px;cursor:pointer;line-height:1}

/* contexte d'article (thème · date) centré dans le bandeau */
.contexte-bar{
  grid-column:2;grid-row:1;text-align:left;min-width:0;
  overflow:hidden;text-overflow:ellipsis;
  font-family:'Cormorant Garamond',serif;
  font-size:13px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--parchemin-att);white-space:nowrap;pointer-events:auto;
}
.contexte-bar:empty{display:none}
.contexte-bar a{transition:color .3s}
.contexte-bar a:hover{color:var(--or)}

/* ---------- recherche ---------- */
.rech-loupe{display:inline-flex;align-items:center;cursor:pointer;color:var(--parchemin-att);transition:color .3s;background:none;border:none;padding:0;outline:none}
.rech-loupe:hover,.rech-loupe:focus{color:var(--or)}
.rech-loupe svg{display:block}
.rech-overlay{position:fixed;inset:0;z-index:200;background:rgba(8,8,8,.98);display:none}
.rech-overlay.ouvert{display:block}
.rech-boite{max-width:760px;margin:0 auto;padding:8vh 24px 40px;height:100%;display:flex;flex-direction:column;box-sizing:border-box}
.rech-haut{display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--filet-fort);padding-bottom:18px}
.rech-haut svg{color:var(--or);flex:none}
#rech-champ{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--parchemin);font-family:'Cormorant Garamond',serif;font-size:30px;letter-spacing:.01em}
#rech-champ::-webkit-search-cancel-button,#rech-champ::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
#rech-champ::placeholder{color:var(--parchemin-att);opacity:.5;font-style:italic}
.rech-fermer{cursor:pointer;color:rgba(255,255,255,.6);font-size:24px;line-height:1;transition:color .3s;flex:none;outline:none;padding:2px 6px}
.rech-fermer:hover,.rech-fermer:focus{color:var(--parchemin)}
.rech-res{margin-top:6px;overflow-y:auto;flex:1;scrollbar-width:thin;scrollbar-color:rgba(231,224,207,.35) var(--encre)}
.rech-msg{padding:38px 4px;color:var(--parchemin-att);font-style:italic;font-size:18px}
.rech-item{display:block;padding:22px 4px;border-bottom:1px solid var(--filet);cursor:pointer;transition:padding-left .3s}
.rech-item:hover,.rech-item.kact{padding-left:14px;background:rgba(20,20,20,.92)}
.rech-meta{font-family:'Cormorant Garamond',serif;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--or);margin-bottom:6px}
.rech-titre{font-family:'Cormorant Garamond',serif;font-size:24px;line-height:1.15;transition:color .3s}
.rech-item:hover .rech-titre,.rech-item.kact .rech-titre{color:var(--or-pale)}
.rech-extrait{margin-top:7px;font-size:16px;color:var(--parchemin-att);line-height:1.55}
.rech-extrait mark{background:none;color:var(--or);font-weight:600}
@media(max-width:720px){#rech-champ{font-size:24px}.rech-boite{padding-top:6vh}}

/* ---------- conteneur de page ---------- */
main{max-width:1080px;margin:0 auto;padding:0 32px;min-height:70vh}
.vue{animation:apparait .6s ease both}
@keyframes apparait{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- accueil ---------- */
.hero{
  padding:112px 0 76px;
  text-align:center;
}
.croix{
  width:72px;height:132px;
  margin:0 auto;
  background-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2072%20132'%3E%3Cpolygon%20points='34.5,40%2037.5,40%2041,2%2031,2'%20fill='%23ffffff'/%3E%3Cpolygon%20points='34.5,40%2037.5,40%2041,130%2031,130'%20fill='%23ffffff'/%3E%3Cpolygon%20points='36,38.5%2036,41.5%202,45%202,35'%20fill='%23ffffff'/%3E%3Cpolygon%20points='36,38.5%2036,41.5%2070,45%2070,35'%20fill='%23ffffff'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:center;background-size:contain;
}

.intro{
  max-width:680px;margin:64px auto;
  text-align:center;
  font-size:23px;color:var(--parchemin-att);
}
.intro p+p{margin-top:18px}

/* titres de section internes */
.titre-section{
  display:flex;align-items:baseline;gap:18px;
  margin:72px 0 36px;
}
.titre-section .num{
  font-family:'Cormorant Garamond',serif;
  font-size:15px;letter-spacing:.2em;color:var(--or);
  white-space:nowrap;
}
.titre-section h2{
  font-family:'Cormorant Garamond',serif;
  font-weight:400;font-size:34px;letter-spacing:.02em;
  white-space:nowrap;
}
.titre-section .trait{flex:1;height:1px;background:var(--filet)}

/* grille des domaines */
.domaines{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:18px;background:transparent;
}
.domaine{
  background:transparent;
  border:1px solid var(--filet);
  padding:34px 30px;
  cursor:pointer;
  transition:background .35s,border-color .35s;
  display:flex;flex-direction:column;gap:12px;
}
.domaine:hover{background:var(--encre-2);border-color:var(--filet-fort)}
.domaine:last-child:nth-child(3n+1){grid-column:1 / -1}
.domaine:last-child:nth-child(3n+2){grid-column:2 / -1}
@media(max-width:900px){
  .domaines{grid-template-columns:repeat(2,1fr)}
  .domaine:last-child:nth-child(3n+1),.domaine:last-child:nth-child(3n+2){grid-column:auto}
  .domaine:last-child:nth-child(2n+1){grid-column:1 / -1}
}
@media(max-width:560px){
  .domaines{grid-template-columns:1fr}
  .domaine:last-child:nth-child(2n+1){grid-column:auto}
}
.domaine .d-num{
  font-family:'Cormorant Garamond',serif;
  font-size:14px;letter-spacing:.18em;color:var(--or);
}
.domaine h3{
  font-family:'Cormorant Garamond',serif;
  font-weight:500;font-size:25px;letter-spacing:.01em;
  transition:color .3s;
}
.domaine:hover h3{color:var(--or-pale)}
.domaine p{font-size:19px;color:var(--parchemin-att);line-height:1.65}
.domaine .compte{
  margin-top:auto;font-size:13px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--parchemin-att);
  font-family:'Cormorant Garamond',serif;
}

/* ---------- bibliothèque : liste d'articles ---------- */
.bandeau-page{
  padding:80px 0 40px;border-bottom:1px solid var(--filet);margin-bottom:8px;
}
.bandeau-page .sur-titre{
  font-family:'Cormorant Garamond',serif;
  text-transform:uppercase;letter-spacing:.36em;
  font-size:12px;color:var(--or);margin-bottom:22px;
}
.bandeau-page h1{
  font-family:'Cormorant Garamond',serif;font-weight:300;
  font-size:clamp(40px,6vw,68px);letter-spacing:.02em;line-height:1.05;
}
.bandeau-page .desc{
  margin-top:20px;max-width:620px;font-size:19px;color:var(--parchemin-att);
}

/* filtres de thèmes */
.filtres{display:flex;flex-wrap:wrap;gap:10px;margin:72px 0 16px}
.filtre{
  font-family:'Cormorant Garamond',serif;
  font-size:15px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--parchemin-att);
  padding:7px 16px;border:1px solid var(--filet);
  cursor:pointer;transition:all .3s;
  background:none;
}
.filtre:hover{color:var(--parchemin);border-color:var(--filet-fort)}
.filtre.actif{color:var(--encre);background:var(--or);border-color:var(--or)}

/* liste */
.liste{margin-top:24px}
.article-lien{
  display:block;padding:30px 4px;
  border-bottom:1px solid var(--filet);
  transition:padding-left .35s;
  cursor:pointer;
}
.article-lien:hover{padding-left:18px}
.article-lien .meta{
  font-family:'Cormorant Garamond',serif;
  font-size:13px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--or);margin-bottom:8px;
}
.article-lien h3{
  font-family:'Cormorant Garamond',serif;
  font-weight:400;font-size:30px;letter-spacing:.01em;
  transition:color .3s;line-height:1.15;
}
.article-lien:hover h3{color:var(--or-pale)}
.article-lien p{margin-top:8px;font-size:20px;color:var(--parchemin-att)}
.voir-plus{display:inline;cursor:pointer;color:var(--or);font-size:15px;letter-spacing:.02em;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.voir-plus:hover{color:var(--or-pale)}
.r-court[hidden],.r-full[hidden]{display:none}
.vide{padding:60px 0;text-align:center;color:var(--parchemin-att);font-style:italic;font-size:19px}
.cat-titre{
  font-family:'Cormorant Garamond',serif;
  font-size:14px;letter-spacing:.28em;text-transform:uppercase;
  color:var(--or);
  margin:46px 0 2px;padding-bottom:14px;
  border-bottom:1px solid var(--filet-fort);
}
.liste > .cat-titre:first-child{margin-top:8px}

/* ---------- bibliothèque : domaines repliables ---------- */
.biblio-barre{display:flex;justify-content:flex-end;margin:30px 0 6px}
.bt{
  font-family:'Cormorant Garamond',serif;
  font-size:14px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--parchemin-att);cursor:pointer;
  display:inline-flex;align-items:center;gap:11px;
  padding:6px 2px;transition:color .3s;
  user-select:none;-webkit-tap-highlight-color:transparent;
}
.bt:hover{color:var(--or-pale)}
.bt .bt-fleche{display:inline-block;color:var(--or);transition:transform .35s ease;transform:rotate(90deg)}
.bt.actif-tout .bt-fleche{transform:rotate(-90deg)}
.domaines-liste{margin-top:30px}
.dom{border-bottom:1px solid var(--filet)}
.dom-tete{
  display:flex;align-items:baseline;gap:20px;
  padding:26px 6px;cursor:pointer;transition:background .3s;
  user-select:none;
}
.dom-tete:hover{background:var(--encre-2)}
.dom-num{
  font-family:'Cormorant Garamond',serif;
  font-size:15px;letter-spacing:.2em;color:var(--or);
  font-variant-numeric:tabular-nums;flex:none;
}
.dom-nom{
  font-family:'Cormorant Garamond',serif;
  font-weight:400;font-size:29px;letter-spacing:.02em;line-height:1.1;
  flex:1;transition:color .3s;
}
.dom-tete:hover .dom-nom{color:var(--or-pale)}
.dom-compte{
  font-family:'Cormorant Garamond',serif;
  font-size:13px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--parchemin-att);white-space:nowrap;flex:none;
}
.dom-chevron{
  font-family:'Cormorant Garamond',serif;
  font-size:26px;line-height:1;color:var(--parchemin-att);flex:none;
  transform:rotate(0);transition:transform .3s ease,color .25s;
}
.dom-tete:hover .dom-chevron{color:var(--or-pale)}
.dom.ouvert .dom-chevron{transform:rotate(90deg)}
.dom.ouvert .dom-tete{
  position:sticky;top:73px;z-index:40;
  background:rgba(0,0,0,.9);backdrop-filter:blur(8px);
}
.dom-sep{
  height:1px;opacity:0;
  background:linear-gradient(90deg,rgba(231,224,207,.5),rgba(231,224,207,.22),rgba(231,224,207,.06),transparent);
}
.dom-corps{display:none;padding:6px 0 22px}
.dom.ouvert .dom-corps{display:block}
.dom-corps > .article-lien:last-child{border-bottom:none}
/* sous-sections (catégories) repliables */
.sous{margin-top:6px}
.sous:first-child{margin-top:0}
.sous-tete{
  display:flex;align-items:center;gap:14px;
  cursor:pointer;user-select:none;padding:16px 6px;
  transition:background .3s;
}
.sous-tete:hover{background:var(--encre-2)}
.sous-puce{width:16px;height:1px;border-radius:0;background:var(--or);flex:none;opacity:.55}
.sous-nom{
  font-family:'Cormorant Garamond',serif;
  font-size:14px;letter-spacing:.26em;text-transform:uppercase;color:var(--or);
  flex:1;transition:color .3s;
}
.sous-tete:hover .sous-nom{color:var(--or-pale)}
.sous-chevron{
  font-family:'Cormorant Garamond',serif;font-size:20px;line-height:1;
  color:var(--parchemin-att);flex:none;transform:rotate(0);
  transition:transform .3s ease,color .25s;
}
.sous-tete:hover .sous-chevron{color:var(--or-pale)}
.sous.ouvert > .sous-tete .sous-chevron{transform:rotate(90deg)}
.sous-corps{display:none;margin-left:9px;padding-left:24px;border-left:1px solid var(--filet)}
.sous.ouvert > .sous-corps{display:block}
.sous-corps .article-lien:last-child{border-bottom:none}
.grp{margin-top:6px}
.grp:first-child{margin-top:0}
.grp-tete{display:flex;align-items:center;gap:14px;cursor:pointer;user-select:none;padding:15px 6px;transition:background .3s}
.grp-tete:hover{background:var(--encre-2)}
.grp-marque{width:7px;height:7px;background:var(--or);flex:none;opacity:.7}
.grp-nom{font-family:'Cormorant Garamond',serif;font-size:19px;letter-spacing:.04em;color:var(--parchemin);flex:1;transition:color .3s}
.grp-tete:hover .grp-nom{color:var(--or-pale)}
.grp-chevron{font-family:'Cormorant Garamond',serif;font-size:20px;line-height:1;color:var(--parchemin-att);flex:none;transform:rotate(0);transition:transform .3s ease,color .25s}
.grp-tete:hover .grp-chevron{color:var(--or-pale)}
.grp.ouvert > .grp-tete .grp-chevron{transform:rotate(90deg)}
.grp-corps{display:none;padding-left:22px}
.grp.ouvert > .grp-corps{display:block}
@keyframes apparaitDom{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes apparaitDomFerme{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-6px)}}

/* ---------- article ---------- */
article.lecture{max-width:720px;margin:0 auto;padding:64px 0 80px}
article.lecture h1{
  font-family:'Cormorant Garamond',serif;font-weight:300;
  font-size:clamp(38px,6vw,60px);line-height:1.08;letter-spacing:.01em;
  margin:0 0 56px;text-align:center;
}
article.lecture>p:first-of-type::first-letter{
  font-family:'Cormorant Garamond',serif;
  float:left;font-size:78px;line-height:.78;
  font-weight:500;color:var(--or);
  margin:8px 14px 0 0;
}
article.lecture p{margin-bottom:22px}
article.lecture h2{
  font-family:'Cormorant Garamond',serif;font-weight:500;
  font-size:30px;letter-spacing:.01em;
  margin:48px 0 18px;
}
article.lecture h3{
  font-family:'Cormorant Garamond',serif;font-weight:500;
  font-size:23px;margin:34px 0 14px;color:var(--parchemin)
}
/* référence biblique en ligne */
.ref{font-weight:600;font-family:'Cormorant Garamond',serif;
  letter-spacing:.04em;color:var(--or);white-space:nowrap}
/* renvois internes entre articles */
article.lecture a,.prose a{
  color:var(--or);
  border-bottom:1px solid rgba(239,230,207,.35);
  transition:color .3s,border-color .3s;
}
article.lecture a:hover,.prose a:hover{color:var(--or-pale);border-color:var(--or-pale)}
article.lecture blockquote{
  margin:30px 0;padding-left:26px;border-left:2px solid var(--filet-fort);
  font-style:italic;color:var(--parchemin-att);
}
.fin-article{
  text-align:center;margin:60px 0 0;
  font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--or);letter-spacing:.4em;
}

/* ---------- à propos ---------- */
.prose{max-width:680px;margin:0 auto;padding:8px 0 80px;font-size:25px;text-align:center}
.prose p{margin-bottom:22px}
.apropos-vue{min-height:70vh;display:flex;flex-direction:column}
.apropos-corps{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 0}
.apropos-vue .prose{padding:0;text-align:left}

/* ---------- pied de page ---------- */
footer{
  border-top:1px solid var(--filet);
  margin-top:40px;
  padding:48px 32px 56px;
  text-align:center;
}
footer .marque{
  font-family:'Cormorant Garamond',serif;
  letter-spacing:.34em;text-transform:uppercase;font-size:18px;
  padding-left:.34em;color:var(--parchemin);
}
footer .verset-pied{
  margin-top:18px;font-style:italic;color:var(--parchemin-att);font-size:17px;
}
footer .verset-pied .ref-pied{font-style:normal}
footer .copy{margin-top:22px;font-size:13px;letter-spacing:.08em;color:var(--parchemin-att);
  font-family:'Cormorant Garamond',serif}

/* ---------- responsive ---------- */
@media(max-width:720px){
  body{font-size:20px}
  .barre{padding:16px 20px;display:flex;justify-content:space-between}
  main{padding:0 20px}
  nav.menu{
    position:fixed;inset:62px 0 auto 0;
    flex-direction:column;gap:0;align-items:flex-start;
    background:rgba(0,0,0,.97);
    padding:10px 28px 18px;
    border-bottom:1px solid var(--filet);
    transform:translateY(-130%);transition:transform .35s;
  }
  nav.menu.ouvert{transform:none}
  nav.menu a{font-size:15px;padding:12px 0;width:100%;border-bottom:none}
  .burger{display:block}
  .contexte-bar{display:none}
  .titre-section h2{font-size:26px;white-space:normal}
  .titre-section{flex-wrap:wrap}
  .dom-tete{gap:13px;padding:22px 2px}
  .dom-nom{font-size:23px}
  .dom-chevron{font-size:22px}
  .dom.ouvert .dom-tete{top:61px}
  .sous-tete{padding:14px 2px;gap:11px}
  .sous-corps{padding-left:18px}
  .grp-tete{padding:13px 2px;gap:11px}
  .grp-nom{font-size:18px}
  .grp-corps{padding-left:18px}
}
.vue:has(.apologie) .lecture{padding-bottom:0}
.apologie{position:relative;max-width:720px;margin:18px auto 96px;padding:28px 30px;border:1px solid var(--filet);transition:background .35s,border-color .35s}
.apologie:hover{background:var(--encre-2);border-color:var(--filet-fort)}
.apologie-lien::after{content:'';position:absolute;inset:0}
.apologie-label{font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--or);margin-bottom:12px}
.apologie-lien{display:inline-block;font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--parchemin);text-decoration:none;transition:color .3s}
.apologie:hover .apologie-lien{color:var(--or-pale)}
.vue:has(.domaines-liste) .bandeau-page{border-bottom:none}
.ll-mob{display:none}
@media(max-width:720px){
nav.menu .rech-loupe{width:100%;justify-content:flex-start;gap:14px;padding:12px 0;border-bottom:none;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--parchemin-att)}
nav.menu .rech-loupe .ll-mob{display:inline}
}

/* ---------- sommaire des articles ---------- */
.smr-cote{display:none!important}
.smr-titre{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--or);margin-bottom:14px}
.smr-liste{border-left:1px solid var(--filet)}
.smr-lien{display:block;padding:6px 0 6px 14px;margin-left:-1px;border-left:1px solid transparent;font-size:13.5px;line-height:1.4;color:var(--parchemin-att);cursor:pointer;transition:color .25s,border-color .25s}
.smr-lien:hover{color:var(--parchemin)}
.smr-lien.actif{color:var(--or);border-left-color:var(--or)}
.smr-mob{display:block;margin:0 0 26px;border:1px solid var(--filet)}
.smr-mob-tete{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer;font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--parchemin-att);transition:color .25s}
.smr-mob-tete:hover{color:var(--parchemin)}
.smr-mob-chev{font-family:ui-monospace,monospace;font-size:16px;transition:transform .3s;color:rgba(255,255,255,.45)}
.smr-mob.ouvert .smr-mob-chev{transform:rotate(90deg)}
.smr-mob-corps{display:none;padding:2px 16px 14px}
.smr-mob.ouvert .smr-mob-corps{display:block}
.smr-mob-corps .smr-lien{padding-left:0;border-left:none;margin-left:0}
article.lecture h2{scroll-margin-top:90px}
/* ---------- taille de lecture (réglée depuis Mon compte) ---------- */
article.lecture p,article.lecture li,article.lecture blockquote{font-size:calc(20px*var(--lvz,1))}
.ttx-row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:18px 0 6px;padding-top:18px;border-top:1px solid var(--filet)}
.ttx-lab{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--parchemin-att)}
.ttx-btns{display:flex;gap:8px}
.ttx-b{background:none;border:1px solid var(--filet);color:var(--parchemin);font-family:'Cormorant Garamond',serif;font-size:14px;min-width:38px;padding:7px 8px;cursor:pointer;transition:border-color .25s,color .25s}
.ttx-b:hover{border-color:var(--or);color:#fff}
.tog-row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:14px 0 6px;padding-top:16px;border-top:1px solid var(--filet)}
.tog-lab{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--parchemin-att)}
.tog-sw{position:relative;width:46px;height:24px;border:1px solid var(--filet-fort);background:none;cursor:pointer;flex:none;transition:border-color .25s}
.tog-sw:hover{border-color:var(--or)}
.tog-sw:focus,.tog-sw:focus-visible{outline:none}
.tog-sw::after{content:'';position:absolute;top:50%;left:3px;width:16px;height:16px;background:rgba(255,255,255,.55);transform:translateY(-50%);transition:left .25s,background .25s}
.tog-sw.on{border-color:var(--or)}
.tog-sw.on::after{left:25px;background:var(--or)}
/* ---------- focus clavier ---------- */
:focus{outline:none}
:focus-visible{outline:1px solid rgba(198,164,92,.8);outline-offset:3px}
.rech-loupe:focus,.rech-loupe:focus-visible{outline:none}
/* ---------- impression ---------- */
@media print{
  body{background:#fff;color:#000;font-size:12pt}
  .barre,nav.menu,.burger,.contexte-bar,footer,.rech-overlay,
  .apologie,#lva-dock,.lva-page,#bp-tab,#bp-pan,#bp-voile,.memo-accueil,.smr-cote,.smr-mob,.art-bar,.art-nav{display:none!important}
  main{padding:0}
  .lecture,.vue{max-width:none}
  h1,h2,h3,.titre-section h2{color:#000}
  .ref,.ref-src,.ref-pied,.rech-meta{color:#000}
  em{color:#000}
  a{color:#000;text-decoration:none}
  .fin-article{color:#000}
}

/* ---------- bloc Mémoriser (accueil) ---------- */
.memo-bloc{max-width:628px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:30px}
.memo-droite{width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.memo-pct{display:flex;align-items:baseline;justify-content:center;gap:11px}
.memo-pct span{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:48px;line-height:1;color:var(--parchemin)}
.memo-pct i{font-style:italic;font-family:'Cormorant Garamond',serif;font-size:14px;letter-spacing:.04em;text-transform:none;color:#ffffff}
.memo-bar{display:flex;width:100%;height:4px;overflow:hidden;background:var(--filet)}
.memo-bar i{display:block;height:100%;width:0;transition:width .6s cubic-bezier(.2,.7,.3,1)}
.memo-bar .r{background:#c75d52}
.memo-bar .a{background:#cfa24f}
.memo-bar .v{background:#7ba37e}
.memo-bar .l{background:var(--or)}
.memo-leg{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--parchemin-att)}
.memo-leg b{color:var(--parchemin);font-weight:600;font-variant-numeric:tabular-nums}
.memo-note{font-size:16px;color:var(--parchemin-att);font-style:italic;margin:0;display:none;text-align:center}
.memo-droite[data-state="out"] .memo-note,
.memo-droite[data-state="empty"] .memo-note{display:block}
.memo-droite:not([data-state="ok"]) .memo-pct,
.memo-droite:not([data-state="ok"]) .memo-bar,
.memo-droite:not([data-state="ok"]) .memo-leg{display:none}
.memo-start{display:inline-block;width:auto;text-align:center;padding:15px 52px;background:var(--or);color:var(--encre);font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;transition:background .3s}
.memo-start:hover{background:var(--or-pale)}
</style>

<body>

<header>
  <div class="barre">
    <a href="#/" class="logo">Lumen</a>
    <button class="burger" id="burger" aria-label="Menu">☰</button>
    <nav class="menu" id="menu">
      <a href="#/" data-route="/">Accueil</a>
      <a href="#/bibliotheque" data-route="/bibliotheque">Bibliothèque</a>
      <a href="memoriser.html">Mémoriser</a>
      <a href="#/a-propos" data-route="/a-propos">À propos</a>
      <span class="rech-loupe" id="rech-ouvrir" role="button" tabindex="0" aria-label="Rechercher"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="6.5"/><line x1="15" y1="15" x2="21" y2="21" stroke-linecap="round"/></svg><span class="ll-mob">Rechercher</span></span>
    </nav>

</header>

<div class="rech-overlay" id="rech-overlay">
  <div class="rech-boite">
    <div class="rech-haut">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="6.5"/><line x1="15" y1="15" x2="21" y2="21" stroke-linecap="round"/></svg>
      <input type="search" id="rech-champ" placeholder="Rechercher dans Lumen…" autocomplete="off" spellcheck="false">
      <span class="rech-fermer" id="rech-fermer" role="button" tabindex="0" aria-label="Fermer">✕</span>
    </div>
    <div class="rech-res" id="rech-res"></div>
  </div>
</div>

<main id="app"></main>

<footer>
  <div class="marque">Lumen</div>
  <div class="verset-pied">« Le peuple qui marchait dans les ténèbres a vu une grande lumière ; sur ceux qui habitaient le pays de l'ombre de la mort, une lumière a resplendi » <span class="ref-pied">Isaïe 9:1</span></div>
  <div class="copy" id="annee"></div>
</footer>

<script>
/* ============================================================
   LUMEN — contenu et navigation
   ------------------------------------------------------------
   POUR AJOUTER DU CONTENU, tu modifies seulement les deux
   tableaux ci-dessous : THEMES (les grands domaines) et
   ARTICLES (chaque entrée de la bibliothèque). Le reste se
   met à jour tout seul.
   ============================================================ */

/* --- LES GRANDS DOMAINES DE LA BIBLIOTHÈQUE --- */
const THEMES = [
  { id:'doctrine',    nom:'Doctrine et dogmes',              desc:"Ce que l'Église croit et enseigne : Dieu, le Christ, le salut, l'Église, les fins dernières.", categories:[
    { id:'dieu',   nom:'Dieu et la Trinité',        arts:['la-nature-de-dieu','la-trinite'] },
    { id:'anges',  nom:'Les anges',                 arts:['les-anges'] },
    { id:'peche',  nom:'Le péché et la chute',      arts:['le-peche','les-peches-capitaux','le-peche-originel','le-nouvel-adam-et-la-nouvelle-eve'] },
    { id:'conscience', nom:'La conscience et la responsabilité', arts:['l-age-de-raison','l-ignorance-invincible'] },
    { id:'christ', nom:'Le Christ et la Rédemption', arts:['l-incarnation','la-croix-et-la-resurrection'] },
    { id:'sacerdoce', nom:'Le sacerdoce',           arts:['le-sacerdoce','le-sacerdoce-reserve-aux-hommes'] },
    { id:'marie',  nom:'La Vierge Marie',           arts:['marie'] },
    { id:'grace',  nom:'La grâce et le salut',      arts:['la-grace','la-predestination','le-salut','la-paix-du-christ','le-bapteme-de-desir'] },
    { id:'vertus', nom:'Les vertus théologales',    arts:['les-vertus-theologales'] },
    { id:'eglise', nom:"L'Église",                  arts:['l-eglise','le-pape','la-communion-des-saints','les-reliques'] },
    { id:'fins',   nom:'Les fins dernières',        arts:['les-fins-dernieres'] },
  ] },
  { id:'ecriture',    nom:'Écriture et exégèse',             desc:"La lecture des Écritures dans la foi de l'Église, du sens littéral aux sens spirituels.", categories:[
    { id:'at',        nom:"L'Ancien Testament",          arts:['la-lutte-de-jacob-avec-dieu','elie-a-l-horeb','l-ange-du-seigneur','un-temps-pour-tuer'] },
    { id:'isaie',     nom:"Le livre d'Isaïe",            arts:['le-proto-isaie','le-deutero-isaie','le-trito-isaie','les-quatre-chants-du-serviteur'] },
    { id:'evangiles', nom:'Les évangiles',               arts:['jesus-et-nicodeme','jesus-devant-pilate','abraham-a-vu-mon-jour','laisse-les-morts-enterrer-leurs-morts','achetez-une-epee','tendre-l-autre-joue'] },
    { id:'vie-du-christ', nom:'La vie du Christ',          arts:['les-prologues-et-la-venue-du-christ','la-preparation-au-ministere','la-premiere-annee-l-inauguration','la-deuxieme-annee-la-popularite','la-troisieme-annee-l-opposition','la-semaine-sainte','la-resurrection-et-la-glorification'] },
    { id:'paul',      nom:'Les lettres de Paul',         arts:['la-femme-dans-l-assemblee','le-voile-et-la-chevelure'] },
    { id:'questions', nom:'Questions sur les Écritures', arts:['le-canon-et-les-deuterocanoniques','l-esclavage-dans-la-bible','les-guerres-d-extermination'] },
  ] },
  { id:'sacrements',  nom:'Liturgie et sacrements',          desc:"Les signes efficaces de la grâce et le culte par lequel l'Église rend gloire à Dieu.", categories:[
    { id:'intro',      nom:'',                                          arts:['les-sacrements'] },
    { id:'initiation', nom:"Les sacrements de l'initiation chrétienne", arts:['le-bapteme','la-confirmation','l-eucharistie'] },
    { id:'guerison',   nom:'Les sacrements de guérison',                arts:['la-confession','l-onction-des-malades'] },
    { id:'service',    nom:'Les sacrements au service de la communion', arts:['l-ordre','le-mariage'] },
  ] },
  { id:'histoire',    nom:"Histoire de l'Église",            desc:"Le chemin de l'Église à travers les siècles, ses conciles et ses combats." },
  { id:'apologetique', nom:'Apologétique', desc:"La défense raisonnée de la foi : répondre aux objections et montrer que croire est accordé à la raison." },
];

/* --- LES ARTICLES ---
   Chaque article : un id unique (sans espace ni accent),
   un titre, le thème (l'id d'un domaine ci-dessus), un résumé,
   une date, et le contenu en HTML. Un verset se cite dans le fil
   d'une phrase, en italique entre guillemets, suivi de la référence :
   ... la nécessité du baptême : <em>« ... »</em> <span class="ref">Jean 3:5</span>
*/
const ARTICLES = [];
const app = document.getElementById('app');
const echappe = s => s; // contenu déjà sûr (écrit par toi)

function compteParTheme(id){ return ARTICLES.filter(a=>a.theme===id).length; }
function themeNom(id){ const t=THEMES.find(x=>x.id===id); return t?t.nom:''; }

/* ---- ACCUEIL ---- */
function vueAccueil(){
  const cartes = THEMES.map((t,i)=>`
    <a class="domaine" href="#/bibliotheque?theme=${t.id}">
      <span class="d-num">${String(i+1).padStart(2,'0')}</span>
      <h3>${t.nom}</h3>
      <p>${t.desc}</p>
      <span class="compte">${compteParTheme(t.id)} entrée${compteParTheme(t.id)>1?'s':''}</span>
    </a>`).join('');
  return `<div class="vue">
    <section class="hero">
      <div class="croix" aria-hidden="true"></div>
    </section>
    <section class="intro">
      <p>Un lieu pour entrer dans l'intelligence de la foi catholique, des premiers pas jusqu'aux questions les plus profondes.</p>
    </section>
    <div class="titre-section">
      <span class="num">Les domaines</span>
      <h2>Explorer par thème</h2>
      <span class="trait"></span>
    </div>
    <section class="domaines">${cartes}</section>
    <div style="height:60px"></div>
  </div>`;
}

/* ---- BIBLIOTHÈQUE ---- */
function articlesOrdonnes(){
  let out=[];
  for(const t of THEMES){
    const at=ARTICLES.filter(a=>a.theme===t.id);
    if(t.categories){
      const vus=new Set();
      for(const c of t.categories){ for(const id of c.arts){ const a=at.find(x=>x.id===id); if(a){out.push(a);vus.add(id);} } }
      for(const a of at) if(!vus.has(a.id)) out.push(a);
    } else out.push(...at);
  }
  return out;
}
function resumeHtml(txt){
  if(txt.length<=195) return `<p>${txt}</p>`;
  var cut=txt.lastIndexOf(' ',150); if(cut<100)cut=150;
  var court=txt.slice(0,cut).replace(/[\s,;:–—-]+$/,'');
  return '<p class="resume r-trunc"><span class="r-court">'+court+'…</span><span class="r-full" hidden>'+txt+'</span> <span class="voir-plus" role="button" tabindex="0" data-more="voir plus" data-less="voir moins">voir plus</span></p>';
}
document.addEventListener('click',function(e){
  var vp=e.target.closest&&e.target.closest('.voir-plus'); if(!vp)return;
  e.preventDefault(); e.stopPropagation();
  var p=vp.closest('.r-trunc'); if(!p)return;
  var court=p.querySelector('.r-court'), full=p.querySelector('.r-full');
  if(full.hasAttribute('hidden')){court.setAttribute('hidden','');full.removeAttribute('hidden');vp.textContent=vp.dataset.less;}
  else{full.setAttribute('hidden','');court.removeAttribute('hidden');vp.textContent=vp.dataset.more;}
});
document.addEventListener('keydown',function(e){
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('voir-plus')){e.preventDefault();e.target.click();}
});
function carteArticle(a){
  return `<a class="article-lien" href="#/article/${a.id}">
      <h3>${a.titre}</h3>
      ${resumeHtml(a.resume)}
    </a>`;
}
function corpsDomaine(t){
  const at = ARTICLES.filter(a=>a.theme===t.id);
  const vide = `<div class="vide">Ce domaine n'a pas encore d'entrée. Les contenus s'ajoutent au fil du temps.</div>`;
  if(!t.categories){
    return at.map(carteArticle).join('') || vide;
  }
  let html='';const vus=new Set();
  for(const c of t.categories){
    const arts = c.arts.map(id=>at.find(a=>a.id===id)).filter(Boolean);
    arts.forEach(a=>vus.add(a.id));
    if(!arts.length) continue;
    if(c.nom){
      html += `<div class="sous" data-cat="${c.id}">
        <div class="sous-tete">
          <span class="sous-puce" aria-hidden="true"></span>
          <span class="sous-nom">${c.nom}</span>
          <span class="sous-chevron" aria-hidden="true">›</span>
        </div>
        <div class="sous-corps">${arts.map(carteArticle).join('')}</div>
      </div>`;
    } else {
      html += arts.map(carteArticle).join('');
    }
  }
  html += at.filter(a=>!vus.has(a.id)).map(carteArticle).join('');
  return html || vide;
}
function vueBibliotheque(params){
  const sections = THEMES.map((t,i)=>{
    const n = ARTICLES.filter(a=>a.theme===t.id).length;
    const num = String(i+1).padStart(2,'0');
    const mot = n<=1?'entrée':'entrées';
    return `<section class="dom" data-theme="${t.id}">
      <div class="dom-tete">
        <span class="dom-num">${num}</span>
        <h2 class="dom-nom">${t.nom}</h2>
        <span class="dom-compte">${n} ${mot}</span>
        <span class="dom-chevron" aria-hidden="true">›</span>
      </div>
      <div class="dom-sep"></div>
      <div class="dom-corps">${corpsDomaine(t)}</div>
    </section>`;
  }).join('');
  return `<div class="vue">
    <section class="bandeau-page">
      <div class="sur-titre">La bibliothèque</div>
      <h1>Les domaines</h1>
    </section>
    <div class="domaines-liste">${sections}</div>
    <div style="height:60px"></div>
  </div>`;
}

/* ---- ARTICLE ---- */
const APOLOGIES={"la-communion-des-saints":"l-intercession-des-saints","le-bapteme":"le-bapteme-des-petits-enfants","marie":"marie-mere-de-dieu","l-eucharistie":"la-presence-reelle"};
function vueArticle(id){
  const a = ARTICLES.find(x=>x.id===id);
  if(!a) return vueIntrouvable();
  const apo = APOLOGIES[id];
  const ap = apo ? ARTICLES.find(x=>x.id===apo) : null;
  const objBloc = ap ? `<aside class="apologie">
      <div class="apologie-label">Réponse aux objections</div>
      <a class="apologie-lien" href="#/article/${apo}">${ap.titre} →</a>
    </aside>` : '';
  return `<div class="vue">
    <article class="lecture">
      <h1>${a.titre}</h1>
      ${echappe(a.contenu)}
    </article>${objBloc}
  </div>`;
}

/* ---- À PROPOS ---- */
function vueAPropos(){
  return `<div class="vue apropos-vue">
    <section class="bandeau-page">
      <div class="sur-titre">Le projet</div>
      <h1>À propos de Lumen</h1>
    </section>
    <div class="apropos-corps">
    <div class="prose">
      <p>Lumen est un lieu d'étude et de méditation autour de la foi catholique. Son but est simple : rendre la théologie accessible et fidèle à l'enseignement de l'Église, pour le débutant qui découvre comme pour le croyant qui veut approfondir.</p>
      <p>Chaque entrée s'appuie sur les Écritures, la tradition de l'Église et l'enseignement constant du Magistère.</p>
      <p>Le site est continuellement enrichi et mis à jour.</p>
    </div>
    </div>
  </div>`;
}

function vueIntrouvable(){
  return `<div class="vue"><section class="bandeau-page"><h1>Page introuvable</h1>
    <p class="desc">Cette page n'existe pas. <a href="#/" style="color:var(--or)">Revenir à l'accueil</a>.</p></section></div>`;
}

/* ---- ROUTAGE ---- */
function router(){
  const hash = location.hash.replace(/^#/,'') || '/';
  const [chemin, query] = hash.split('?');
  const params = new URLSearchParams(query||'');
  let html, route='/', ctx='';
  if(chemin==='/'||chemin===''){ html=vueAccueil(); route='/'; }
  else if(chemin==='/bibliotheque'){ html=vueBibliotheque(params); route='/bibliotheque'; ctx='La bibliothèque'; }
  else if(chemin==='/a-propos'){ html=vueAPropos(); route='/a-propos'; }
  else if(chemin.startsWith('/article/')){
    const aid=chemin.split('/article/')[1];
    html=vueArticle(aid); route='/bibliotheque';
    const a=ARTICLES.find(x=>x.id===aid);
    if(a) ctx=`<a href="#/bibliotheque?theme=${a.theme}">${themeNom(a.theme)}</a>`;
  }
  else { html=vueIntrouvable(); }
  app.innerHTML = html;
  document.getElementById('contexte').innerHTML = ctx;
  window.scrollTo(0,0);
  document.querySelectorAll('nav.menu a').forEach(a=>{
    a.classList.toggle('actif', a.dataset.route===route);
  });
  document.getElementById('menu').classList.remove('ouvert');
  brancherDomaines(params);
}

function cascadeApparition(els){
  els.forEach((el,i)=>{
    if(!el) return;
    const d=Math.min(i*32,240);
    el.style.animation='none';
    void el.offsetHeight;
    el.style.animation='apparaitDom .4s cubic-bezier(.2,.7,.3,1) '+d+'ms both';
    const done=()=>{ el.style.animation=''; el.removeEventListener('animationend',done); };
    el.addEventListener('animationend',done);
    setTimeout(()=>{ if(el.style.animation) el.style.animation=''; }, 900+d);
  });
}
function cascadeFermeture(els,fin){
  els.forEach(el=>{ if(el) el.style.animation='apparaitDomFerme .2s ease forwards'; });
  setTimeout(fin,190);
}
function ouvrirDomaine(sec){
  if(!sec||sec.classList.contains('ouvert')) return;
  sec.classList.add('ouvert');
  const sep=sec.querySelector('.dom-sep'), corps=sec.querySelector('.dom-corps');
  cascadeApparition([sep].concat([].slice.call(corps.children)));
}
function fermerDomaine(sec){
  if(!sec||!sec.classList.contains('ouvert')) return;
  const sep=sec.querySelector('.dom-sep'), corps=sec.querySelector('.dom-corps');
  cascadeFermeture([sep].concat([].slice.call(corps.children)), ()=>{ sec.classList.remove('ouvert'); majToutLabel(); });
}
function basculerDomaine(sec){
  sec.classList.contains('ouvert') ? fermerDomaine(sec) : ouvrirDomaine(sec);
  majToutLabel();
}
function ouvrirSous(s){
  if(!s||s.classList.contains('ouvert')) return;
  s.classList.add('ouvert');
  const corps=s.querySelector('.sous-corps');
  cascadeApparition([].slice.call(corps.children));
}
function fermerSous(s){
  if(!s||!s.classList.contains('ouvert')) return;
  const corps=s.querySelector('.sous-corps');
  cascadeFermeture([].slice.call(corps.children), ()=>{ s.classList.remove('ouvert'); });
}
function basculerSous(s){ s.classList.contains('ouvert') ? fermerSous(s) : ouvrirSous(s); }
function basculerTout(){
  const secs=[].slice.call(document.querySelectorAll('.dom'));
  const ouverts=secs.filter(s=>s.classList.contains('ouvert'));
  if(ouverts.length){ ouverts.forEach(fermerDomaine); }
  else { secs.forEach((s,i)=> setTimeout(()=>ouvrirDomaine(s), i*110)); }
  setTimeout(majToutLabel,10);
}
function majToutLabel(){
  const b=document.getElementById('basculerTout'); if(!b) return;
  const ouvert=[].slice.call(document.querySelectorAll('.dom')).some(s=>s.classList.contains('ouvert'));
  b.classList.toggle('actif-tout',ouvert);
  const l=b.querySelector('.bt-label'); if(l) l.textContent = ouvert ? b.dataset.collapse : b.dataset.expand;
}
function brancherDomaines(params){
  const b=document.getElementById('basculerTout');
  if(b){
    b.addEventListener('click',basculerTout);
    b.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); basculerTout(); }});
  }
  document.querySelectorAll('.dom-tete').forEach(t=>{
    t.addEventListener('click',()=>basculerDomaine(t.closest('.dom')));
  });
  document.querySelectorAll('.sous-tete').forEach(st=>{
    st.addEventListener('click',()=>basculerSous(st.closest('.sous')));
  });
  const theme=params&&params.get?params.get('theme'):null;
  if(theme){
    const sec=document.querySelector('.dom[data-theme="'+theme+'"]');
    if(sec){
      ouvrirDomaine(sec);
      majToutLabel();
      setTimeout(()=>sec.scrollIntoView({behavior:'smooth',block:'start'}),120);
      return;
    }
  }
  majToutLabel();
}

document.getElementById('burger').addEventListener('click',()=>{
  document.getElementById('menu').classList.toggle('ouvert');
});
document.getElementById('annee').textContent = '© ' + new Date().getFullYear() + ' Lumen';

/* ---- recherche ---- */
(function(){
  var ouvrir=document.getElementById('rech-ouvrir'),overlay=document.getElementById('rech-overlay'),
      champ=document.getElementById('rech-champ'),res=document.getElementById('rech-res'),fermer=document.getElementById('rech-fermer');
  if(!ouvrir||!overlay) return;
  function norm(s){return s.toLowerCase().replace(/[àâä]/g,'a').replace(/[éèêë]/g,'e').replace(/[ïî]/g,'i').replace(/[ôö]/g,'o').replace(/[ùûü]/g,'u').replace(/ç/g,'c');}
  function depouiller(h){return h.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();}
  var index=ARTICLES.map(function(a){return {s:a.id,t:a.titre,th:themeNom(a.theme),r:a.resume,x:depouiller(a.contenu)};});
  index.forEach(function(a){a._n=norm(a.t+' '+a.r+' '+a.x);a._t=norm(a.t);a._r=norm(a.r);});
  function surligne(texte,termes){
    var nt=norm(texte),marks=[];
    termes.forEach(function(t){var i=0,p;while((p=nt.indexOf(t,i))>=0){marks.push([p,p+t.length]);i=p+t.length;}});
    if(!marks.length) return texte;
    marks.sort(function(a,b){return a[0]-b[0];});
    var out='',cur=0;
    marks.forEach(function(m){if(m[0]<cur)return;out+=texte.slice(cur,m[0])+'<mark>'+texte.slice(m[0],m[1])+'</mark>';cur=m[1];});
    return out+texte.slice(cur);
  }
  function extrait(a,termes){
    var src=a.r+' '+a.x,n=norm(src),pos=-1;
    termes.forEach(function(t){var p=n.indexOf(t);if(p>=0&&(pos<0||p<pos))pos=p;});
    if(pos<0)pos=0;
    var deb=Math.max(0,pos-60),fin=Math.min(src.length,pos+120);
    return (deb>0?'… ':'')+surligne(src.slice(deb,fin),termes)+(fin<src.length?' …':'');
  }
  function chercher(q){
    var termes=norm(q).split(/\s+/).filter(Boolean);
    if(!termes.length){res.innerHTML='<div class="rech-msg">Tapez un mot pour parcourir les articles.</div>';return;}
    var out=[];
    index.forEach(function(a){
      if(!termes.every(function(t){return a._n.indexOf(t)>=0;})) return;
      var sc=0;termes.forEach(function(t){if(a._t.indexOf(t)>=0)sc+=5;if(a._r.indexOf(t)>=0)sc+=2;sc+=1;});
      out.push({a:a,sc:sc});
    });
    out.sort(function(x,y){return y.sc-x.sc;});
    if(!out.length){res.innerHTML='<div class="rech-msg">Aucun résultat pour « '+q+' ».</div>';return;}
    res.innerHTML=out.slice(0,30).map(function(o){
      return '<a class="rech-item" href="#/article/'+o.a.s+'"><div class="rech-meta">'+o.a.th+'</div><div class="rech-titre">'+o.a.t+'</div><div class="rech-extrait">'+extrait(o.a,termes)+'</div></a>';
    }).join('');
  }
  function ouvre(){overlay.classList.add('ouvert');document.body.style.overflow='hidden';chercher(champ.value);setTimeout(function(){champ.focus();},40);}
  function ferme(){overlay.classList.remove('ouvert');document.body.style.overflow='';}
  ouvrir.addEventListener('click',ouvre);
  ouvrir.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();ouvre();}});
  fermer.addEventListener('click',ferme);
  fermer.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();ferme();}});
  overlay.addEventListener('click',function(e){if(e.target===overlay)ferme();});
  res.addEventListener('click',function(e){if(e.target.closest('.rech-item'))ferme();});
  champ.addEventListener('input',function(){chercher(champ.value);});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&overlay.classList.contains('ouvert'))ferme();});
})();
