[build]
  command   = "node fabrication/build-bi.js"
  publish   = "site"

[build.environment]
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[[headers]]
  for = "/lumen-app.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/bible-panneau.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Les scripts des pages, sortis par publication.js, portent leur empreinte
# dans leur nom : ils peuvent être gardés un an, un changement change le nom.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/polices/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/site-sw.js"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"

[[headers]]
  for = "/memoriser-sw.js"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"

[[headers]]
  for = "/memoriser.html"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"

# Site privé (26/09) : la porte à mot de passe est dans
# netlify/edge-functions/porte.js, le mot de passe dans la variable
# LUMEN_MOT_DE_PASSE (Netlify → Site configuration → Environment variables).

# ── En-têtes de sécurité, sur tout le site (05/09) ──
# nosniff : un fichier n'est jamais interprété comme autre chose que son type.
# SAMEORIGIN : la Bible peut vivre dans son tiroir (même site), personne
# d'autre ne peut encadrer le site dans une page tierce.
# Referrer-Policy : les adresses complètes ne fuient pas vers les sites tiers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Robots-Tag = "noindex, nofollow"
