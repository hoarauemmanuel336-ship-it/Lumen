[build]
  command   = "node fabrication/build-bi.js"
  publish   = "site"

# Les fonctions Node (la méditation du jour, dans netlify/functions/) sont
# assemblées par esbuild : la fabrique emporte avec elle la Chérubin
# (contenu/bible.json) pour lire les versets qu'elle cite.
[functions]
  node_bundler = "esbuild"

[build.environment]
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[[headers]]
  for = "/lumen-app.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/bible-panneau.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Les scripts des pages, sortis par publication.js, portent leur empreinte
# dans leur nom : ils peuvent être gardés un an, un changement change le nom.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/polices/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Les polices des cours : lues par le cadre isolé d'Étude, qui n'a pas
# l'origine du site, d'où l'accès ouvert à toute origine.
[[headers]]
  for = "/polices-cours/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/site-sw.js"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"

[[headers]]
  for = "/memoriser-sw.js"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"

[[headers]]
  for = "/memoriser.html"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"

# Site privé (26/09) : la porte à mot de passe est dans
# netlify/edge-functions/porte.js, le mot de passe dans la variable
# LUMEN_MOT_DE_PASSE (Netlify → Site configuration → Environment variables).
# Ce que le site dit aux moteurs de recherche ne se règle pas ici : la
# fabrication pose l'en-tête qui les écarte (fichier _headers) tant que
# contenu/referencement.json les tient fermés.

# ── En-têtes de sécurité, sur tout le site (05/09) ──
# nosniff : un fichier n'est jamais interprété comme autre chose que son type.
# SAMEORIGIN : la Bible peut vivre dans son tiroir (même site), personne
# d'autre ne peut encadrer le site dans une page tierce.
# Referrer-Policy : les adresses complètes ne fuient pas vers les sites tiers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
