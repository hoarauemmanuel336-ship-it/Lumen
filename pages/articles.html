<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="darkreader-lock"><style>html{color-scheme:dark}@media (prefers-color-scheme:dark){html{color-scheme:dark}}@media (prefers-color-scheme:light){html{color-scheme:dark}}</style>
<title>Articles &#183; Lumen Veritatis</title>
<link rel="apple-touch-icon" href="/icones/lumen-180.png">
<meta name="theme-color" content="#000000">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
:root{
  --encre:#000000;--encre-2:#0b0b0b;
  --or:#efe6cf;--or-pale:#f8f3e6;
  /* fond de survol : la couleur d'accent, une seule intensité pour tout
     le site. La seconde ligne suit l'accent ; un vieux navigateur l'ignore
     et garde la première. */
  --surv:rgba(239,230,207,.06);
  --surv:color-mix(in srgb, var(--or) 6%, transparent);
  /* texte sélectionné : la même couleur, plus franche, texte en noir */
  --sel:rgba(239,230,207,.5);
  --sel:color-mix(in srgb, var(--or) 50%, transparent);
  /* halo de survol des rangées : une lueur diffuse au-dehors */
  --halo:rgba(239,230,207,.1);
  --halo:color-mix(in srgb, var(--or) 10%, transparent);
  --parchemin:#ffffff;--pa:rgba(255,255,255,.6);--pa2:rgba(255,255,255,.5);
  --filet:rgba(231,224,207,.14);--filet-f:rgba(231,224,207,.28);
  --parchemin-att:rgba(255,255,255,.52);--filet-fort:rgba(231,224,207,.34);--pourpre:#9a3b3b;
  --serif:'EB Garamond',Georgia,serif;--display:'Cormorant Garamond',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%;scroll-behavior:smooth}
body{background:var(--encre);color:var(--parchemin);font-family:var(--serif);font-size:20px;line-height:1.6;min-height:100%;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::selection{background:var(--sel);color:var(--encre)}
:focus{outline:none}
:focus-visible{outline:1px solid rgba(198,164,92,.8);outline-offset:3px}
*{scrollbar-width:thin;scrollbar-color:rgba(239,230,207,.35) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(239,230,207,.35);background-clip:content-box;border:3px solid transparent;border-radius:99px}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.wrap{width:100%;max-width:772px;margin:0 auto;padding:46px 26px 90px;animation:fade .4s ease both}   /* 772 - 2×26 = 720 px de texte, comme la colonne de la Bible */
/* pied de page collé en bas sur les pages courtes : le corps est une colonne, le contenu prend la place libre */
body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
main.wrap{flex:1 0 auto}
body>footer{flex-shrink:0}
.tete{display:flex;align-items:baseline;justify-content:space-between;gap:18px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--filet);margin-bottom:6px}
.tete h1{font-family:var(--display);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--pa);font-weight:500}
.resume{font-size:14px;color:var(--pa2);margin:14px 0 4px}

/* actions en texte, jamais en boîte */
.acts{display:flex;align-items:center;justify-content:center;gap:30px;flex-wrap:wrap;margin:28px 0 6px}
/* (en-tête, états, actions : voir lumen-commun.css, posée par le build dans chaque page)*/
.act{position:relative;font-family:var(--display);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--pa2);transition:color .3s}
.act::before{content:'';position:absolute;inset:-15px -10px}
.act:hover{color:var(--or)}
/* Les actions de la liste sont allumées d'emblée, à la couleur d'accent :
   ce sont les portes de la page. Le survol les éclaircit d'un cran. Les
   actions de l'éditeur gardent leur teinte discrète. */
#acts-liste .act{color:var(--or)}
#acts-liste .act:hover{color:var(--or-pale)}
.act.danger:hover{color:var(--pourpre)}
@media(max-width:720px){.acts{gap:24px;margin-top:26px}}

/* ═══ RANGEMENT : SECTIONS ET SOUS-SECTIONS ═══ */
/* Une rubrique est un intitulé, jamais une boîte. AUCUN FILET sur les
   en-têtes : seuls les articles portent leur ligne de séparation, sinon les
   traits s'empilent (Emmanuel : « des traits sur des traits »). */
.rub{margin-bottom:0}
.rub-tete{display:flex;align-items:center;gap:12px;padding:26px 2px 13px;cursor:pointer}
.rub-1:first-child>.rub-tete{padding-top:12px}
.rub-nom{flex:1;min-width:0;font-family:var(--display);font-size:14.5px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.88);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .3s}
.rub-tete:hover .rub-nom{color:var(--or)}
.rub-n{flex-shrink:0;font-size:12.5px;color:var(--pa2)}
.rub-menu{position:relative;flex-shrink:0;color:var(--pa2);font-size:15px;line-height:1;padding:0 4px;letter-spacing:.08em;transition:color .3s}
.rub-menu::before{content:'';position:absolute;inset:-14px -7px}
.rub-menu:hover{color:var(--or)}
.rub-chev{flex-shrink:0;font-family:var(--display);font-size:18px;color:var(--pa2);line-height:1;transition:transform .3s,color .3s}
@media(max-width:720px){
  .rub-tete{padding:24px 2px 14px}
  .rub-chev{font-size:20px}
}

/* ═══ LISTE ═══ */
.art-item{display:block;width:100%;text-align:left;padding:20px 10px 18px;box-shadow:inset 0 -1px 0 var(--filet);transition:background .25s,box-shadow .25s;cursor:pointer}
.art-item:hover{background:var(--surv);box-shadow:inset 2px 0 0 var(--or),inset 0 -1px 0 var(--filet)}
.art-titre{font-family:var(--display);font-size:23px;color:var(--parchemin);line-height:1.3;transition:color .25s,text-shadow .25s}
.art-extrait{transition:color .25s}
.art-vide-titre{color:var(--pa2);font-style:italic}
.art-extrait{font-size:15px;color:var(--pa);margin-top:5px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.art-pied{display:flex;align-items:center;gap:12px;margin-top:9px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.58)}
.art-ligne{display:flex;align-items:flex-start;gap:6px;box-shadow:inset 0 -1px 0 var(--filet);transition:background .25s,box-shadow .25s}
/* Au survol, la ligne s'illumine sans bouger : halo diffus, fond au ton
   d'accent, titre qui s'éclaire. */
.art-ligne:hover{background:var(--surv);box-shadow:0 0 26px var(--halo),inset 0 -1px 0 var(--filet)}
.art-ligne:hover .art-titre{color:#fff;text-shadow:0 0 14px color-mix(in srgb,var(--or) 28%,transparent)}
.art-ligne:hover .art-extrait{color:rgba(255,255,255,.75)}
.art-ligne .art-item{flex:1;min-width:0;box-shadow:none;background:none}
.art-ligne .art-item:hover{background:none;box-shadow:none}
.art-menu{position:relative;flex-shrink:0;align-self:center;color:var(--pa2);font-size:15px;line-height:1;padding:0 8px;letter-spacing:.08em;transition:color .3s}
.art-menu::before{content:'';position:absolute;inset:-16px -8px}
.art-menu:hover{color:var(--or)}
.art-etat{color:var(--pa2)}
.vide{font-size:15px;color:var(--pa2);padding:40px 2px;text-align:center;line-height:1.7}

/* ═══ ÉDITEUR ═══ */
#ecran-edit{display:none}
#ecran-voir{display:none}
.lire-titre{font-family:var(--display);font-size:calc(38px*var(--lvz,1));line-height:1.16;font-weight:400;color:var(--parchemin);text-align:center;padding:10px 0 6px}
.lire-pied{text-align:center;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.58);margin-bottom:26px}
@media(max-width:720px){.lire-titre{font-size:calc(30px*var(--lvz,1))}}
.ed-titre{width:100%;background:none;border:none;color:var(--parchemin);font-family:var(--display);font-size:calc(38px*var(--lvz,1));line-height:1.22;padding:10px 0 20px;outline:none;resize:none;overflow:hidden;text-align:center}
.ed-titre::placeholder{color:rgba(255,255,255,.22)}

/* barre de mise en forme */
.outils{position:sticky;top:var(--hbar,86px);z-index:30;display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding:12px 2px;margin-bottom:6px;background:var(--encre);box-shadow:inset 0 -1px 0 var(--filet)}
.enr{margin-left:auto;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.28);transition:color .3s}
.enr.vu{color:var(--pa2)}
@media(max-width:720px){.outils{gap:16px;font-size:12px}.ed-titre{font-size:calc(30px*var(--lvz,1))}}

/* ═══ MODALES ═══ */
.overlay{position:fixed;inset:0;z-index:120;background:rgba(4,4,4,.9);display:none;align-items:center;justify-content:center;padding:24px}
.overlay.on{display:flex}
.modal{width:100%;max-width:440px;background:var(--encre);border:1px solid var(--filet-f);padding:34px 30px;animation:rise .3s ease both;max-height:calc(100vh - 48px);overflow-y:auto}
.modal-titre{font-family:var(--display);font-size:22px;margin-bottom:20px}
.modal-txt{font-size:15px;line-height:1.65;color:var(--pa);margin-bottom:6px}
.champ{width:100%;background:#161616;border:1px solid var(--filet-f);color:var(--parchemin);font-family:var(--serif);font-size:16px;padding:10px 13px;outline:none;transition:border-color .3s;margin-top:14px}
.champ:focus{border-color:var(--or)}
.champ::placeholder{color:var(--pa2)}
.modal-btns{display:flex;justify-content:flex-end;gap:14px;margin-top:26px;flex-wrap:wrap}
.m-annul{font-family:var(--display);font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--pa);padding:9px 14px;transition:color .3s}
.m-annul:hover{color:var(--or)}
.m-ok{font-family:var(--display);font-size:14px;letter-spacing:.1em;text-transform:uppercase;background:var(--or);color:var(--encre);padding:10px 20px;transition:background .3s}
.m-ok:hover{background:var(--or-pale)}
.choix{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 10px;cursor:pointer;box-shadow:inset 0 -1px 0 var(--filet);transition:color .25s,background .25s}
.choix:hover{color:var(--or-pale);background:var(--surv)}
.choix.del:hover{color:var(--pourpre)}
.choix i{font-style:normal;font-family:var(--display);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--pa2);flex:none}
/* l'arbre du rangement : retrait par niveau, un petit chevron devant les
   sections, les entrées interdites en gris et sans survol */
.choix span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.choix .cx-arbre{flex:none;font-family:var(--display);font-style:normal;font-weight:400;color:var(--pa2);margin-right:-4px}
.choix.off{color:var(--pa2);cursor:default}
.choix.off:hover{color:var(--pa2);background:none}
.choix.fort{font-family:var(--display);letter-spacing:.06em}
@media(max-width:600px){
  .overlay{padding:16px;align-items:flex-start;overflow-y:auto}
  .modal{max-width:100%;padding:28px 20px;margin:22px 0;max-height:none}
  .modal-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .modal-btns .m-annul,.modal-btns .m-ok{width:100%;text-align:center;padding:12px 8px}
}

/* compte */
.auth-ov{position:fixed;inset:0;z-index:4000;background:rgba(8,8,8,.98);display:none;align-items:center;justify-content:center;padding:24px}
.auth-ov.ouvert{display:flex}
.auth-box{position:relative;width:100%;max-width:400px;background:var(--encre);border:1px solid var(--filet);padding:40px 34px}
.auth-x{position:absolute;top:16px;right:18px;cursor:pointer;color:var(--pa);font-size:22px;line-height:1;transition:color .3s}
.auth-x:hover{color:var(--parchemin)}
.auth-t{font-family:var(--display);font-size:24px;text-align:center;margin-bottom:20px}
.auth-mail{text-align:center;color:var(--pa);font-size:15px;margin-bottom:20px;word-break:break-all}
.macct-btn{display:block;width:100%;text-align:center;padding:13px 10px;margin-bottom:10px;border:1px solid var(--filet-fort);color:var(--parchemin);font-family:var(--display);font-size:14px;letter-spacing:.18em;text-transform:uppercase;transition:border-color .3s,color .3s,background .3s}
.macct-btn:hover{border-color:var(--or);color:var(--or-pale);background:var(--surv)}
/* Le panneau « Mon compte » est le même partout : ces règles sont reprises
   mot pour mot de bible.html et memoriser.html. Une retouche ici se fait
   aussi là-bas. */
.ttx-row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:18px 0 6px;padding-top:18px;border-top:1px solid var(--filet)}
.ttx-lab{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.ttx-btns{display:flex;gap:8px}
.ttx-b{background:none;border:1px solid var(--filet);color:#fff;font-family:var(--display);font-size:14px;min-width:38px;padding:7px 8px;cursor:pointer;transition:border-color .25s,color .25s}
.ttx-b:hover{border-color:var(--or)}
.tog-row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:14px 0 6px;padding-top:16px;border-top:1px solid var(--filet)}
.tog-lab{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.tog-sw{position:relative;width:46px;height:24px;border:1px solid var(--filet-f);background:none;cursor:pointer;flex:none;transition:border-color .25s}
.tog-sw:hover{border-color:var(--or)}
.tog-sw::after{content:'';position:absolute;top:50%;left:3px;width:16px;height:16px;background:rgba(255,255,255,.55);transform:translateY(-50%);transition:left .25s,background .25s}
.tog-sw.on{border-color:var(--or)}
.tog-sw.on::after{left:25px;background:var(--or)}
.auth-out{display:block;width:100%;text-align:center;color:rgba(255,255,255,.55);font-family:var(--display);font-size:14px;margin-top:16px;transition:color .25s}
.auth-out:hover{color:var(--or)}
</style>
<style>
/* ═══════════ FICHE, RANGEMENT ═══════════ */
/* ── LE ⋯ EN BLANC, BIEN ALLUMÉ ──
   Les trois points des rubriques sont en blanc plein avec un halo blanc,
   sans attendre le survol (choix d'Emmanuel). Le survol ajoute un peu de
   lumière. */
html body .rub-menu{color:#fff;opacity:1;text-shadow:0 0 10px rgba(255,255,255,.7),0 0 20px rgba(255,255,255,.3)}
html body .rub-menu:hover{color:#fff;text-shadow:0 0 12px rgba(255,255,255,.95),0 0 26px rgba(255,255,255,.45)}

/* ── la ressource en grand ── */
.res-cadre{border:1px solid var(--filet);background:#050505;margin:6px 0 4px}
/* ── LE CONTENU S'OUVRE EN PLEIN ÉCRAN ──
   Il prend tout l'écran, sans cadre ni barre autour, et se lit comme le
   fichier ouvert seul. Un bouton discret en bas à gauche (et la touche
   Échap) ramène à la liste. */
.res-plein{position:fixed;top:0;left:0;width:100%;height:100%;height:100dvh;border:0;z-index:200;background:#000;display:block}
.res-plein-x{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));z-index:201;display:inline-flex;align-items:center;gap:9px;padding:9px 15px;border:1px solid rgba(255,255,255,.22);border-radius:999px;background:rgba(0,0,0,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-family:var(--display);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.72);cursor:pointer;transition:color .3s,border-color .3s,background .3s}
.res-plein-x:hover,.res-plein-x:focus-visible{color:#fff;border-color:var(--or);background:rgba(0,0,0,.82)}
body.plein{overflow:hidden}
/* la fiche qui attend derrière : de quoi rouvrir sans repasser par la liste */
.res-rouvrir{display:inline-block;margin:20px 0 4px;padding:13px 26px;border:1px solid var(--filet-f);font-family:var(--display);font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--parchemin);background:none;cursor:pointer;transition:border-color .3s,color .3s,background .3s}
.res-rouvrir:hover{border-color:var(--or);color:var(--or);background:var(--surv)}
/* ── UNE IMAGE SE VOIT D'ABORD EN ENTIER ──
   Elle tient dans l'écran d'un seul coup, au centre de son cadre, même
   quand elle est en hauteur. Un clic la porte à sa pleine largeur pour lire
   les petits caractères, un second la remet en place. */
.res-cadre.img{display:flex;align-items:center;justify-content:center;padding:14px}
.res-cadre.img img{display:block;width:auto;max-width:100%;max-height:min(78vh,1000px);height:auto;cursor:zoom-in;transition:max-height .35s ease}
.res-cadre.img.zoom{padding:0}
.res-cadre.img.zoom img{width:100%;max-height:none;cursor:zoom-out}
@media(max-width:720px){.res-cadre.img{padding:8px}.res-cadre.img img{max-height:72vh}}
.res-cadre img{display:block;width:100%;height:auto}
.res-cadre iframe{display:block;width:100%;border:0;background:#000}
.res-desc{font-family:var(--serif);font-size:calc(17px*var(--lvz,1));line-height:1.72;color:var(--pa);margin:20px 0 4px;white-space:pre-wrap}
.res-lien{display:inline-block;margin:22px 0 4px;padding:13px 26px;border:1px solid var(--filet-f);font-family:var(--display);font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--parchemin);text-decoration:none;transition:border-color .3s,color .3s,background .3s}
.res-lien:hover{border-color:var(--or);color:var(--or);background:var(--surv)}
.res-url{font-size:12.5px;color:var(--pa2);word-break:break-all;margin-top:12px}

/* ── le formulaire ── */
.champ-lab{display:block;font-family:var(--display);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--pa2);margin:26px 0 9px}
.res-zone{width:100%;box-sizing:border-box;background:var(--encre-2);border:1px solid var(--filet);color:var(--parchemin);font-family:var(--serif);font-size:16px;line-height:1.6;padding:13px 15px;outline:none;resize:vertical;transition:border-color .3s}
.res-zone:focus{border-color:var(--filet-fort)}
.res-zone.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.55}
.depose.survol{border-color:var(--or);border-style:solid;background:var(--surv);box-shadow:0 0 26px var(--halo)}
.depose .dep-mot{flex:1;min-width:180px;font-size:15px;color:var(--pa)}
.depose{transition:border-color .25s,background .25s,box-shadow .25s;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:20px;border:1px dashed var(--filet-f);color:var(--pa)}
.depose .poids{font-size:12px;color:var(--pa2);white-space:nowrap}
.aide{font-size:12.5px;line-height:1.6;color:var(--pa2);margin-top:10px}

/* ── ON ENTRE, ON RESSORT ──
   On entre dans une catégorie ou une section comme dans un livre de la
   Bible du site, et le fil d'Ariane dit où l'on est et ramène d'un clic. */
.fil{font-family:var(--display);font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--pa2);padding:4px 0 6px}
/* Dans une catégorie, son nom prend la place du petit intitulé : un vrai
   titre, dans le Cormorant. */
.tete.dedans{padding-bottom:14px;margin-bottom:8px}
.tete.dedans h1{font-size:31px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--parchemin);line-height:1.15}
.tete.dedans .art-etat{font-family:var(--display);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
@media(max-width:600px){.tete.dedans h1{font-size:26px}}
.fil span{cursor:pointer;transition:color .3s}
.fil span:hover{color:var(--or)}
.fil i{font-style:normal;padding:0 9px;color:rgba(255,255,255,.22)}
.fil b{font-weight:400;color:var(--pa)}
/* ═══ ORGANISER : GLISSER-DÉPOSER ═══
   On prend l'objet et on le pose où l'on veut. Le mode « Organiser » fait
   apparaître une poignée (⠿), seule, sans flèches ; on la tire, un repère
   dit où l'objet va se poser, et l'on lâche. Posé SUR une rubrique, il y
   entre ; posé sur un maillon du fil d'Ariane, il remonte. Hors du mode,
   rien de tout cela n'existe. */
.poignee{display:none}
body.organise .poignee{display:flex;align-items:center;justify-content:center;flex:none;width:30px;height:30px;color:var(--pa2);font-size:17px;line-height:1;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;transition:color .25s}

<script>
// ════════ FIREBASE ════════
/* Sans le service de connexion (bloqueur, réseau coupé), la page le dit et
   s'arrête proprement au lieu de rester muette. */
if(typeof firebase==='undefined'){
  const dire=()=>{const m=document.getElementById('mot-liste');if(m)m.textContent='Le service de connexion n’a pas pu être chargé. Vérifiez la connexion ou un bloqueur, puis rechargez la page.';const l=document.getElementById('liste');if(l)l.innerHTML='';const a=document.getElementById('acts-liste');if(a)a.style.display='none';};
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',dire);else dire();
  throw new Error('Firebase absent');
}
firebase.initializeApp({
  apiKey:"AIzaSyC19lFNWUd-KYhCP4o7gpp0IcyfRTyHOyA",
  authDomain:"lumen-veritatis.firebaseapp.com",
  projectId:"lumen-veritatis",
  storageBucket:"lumen-veritatis.firebasestorage.app",
  messagingSenderId:"195902823875",
  appId:"1:195902823875:web:a8be1f216a5ae1d945f176"
});
const auth=firebase.auth();
const db=firebase.firestore();
try{db.enablePersistence({synchronizeTabs:true}).catch(function(){});}catch(_){}

/* Une seule plume : les articles sont écrits par ce compte, et par lui seul.
   Ils vivent dans l’espace privé du compte, que gardent les règles de
   sécurité de la base. */
const AUTEUR='hoarauemmanuel336@gmail.com';

// ════════ ÉTAT ════════
/* liste : ce qui vit. jetees : ce qui est à la corbeille (même compte, même
   collection, marqué d'une date de mise au rebut). corb : les domaines et
   sections jetés. pris : ce qui est coché en mode Choisir. */
const S={uid:null,auteur:false,liste:[],jetees:[],res:null,sale:false,minute:null,rubs:[],corb:[],ouLa:'',vu:'',choix:false,pris:new Set()};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const acol=()=>db.collection('users/'+S.uid+'/art_pages');
const rdoc=()=>db.doc('users/'+S.uid+'/meta/art_rubriques');

/* ── LES QUATRE ESPÈCES ──
   Un article est de l'espèce « diagramme » (nommée « Code ») : une page HTML
   qui tourne dans un cadre isolé. L'éditeur la pose d'office. Image, PDF et
   lien restent reconnus pour les fiches qui les portent : une image et un
   PDF sont des fichiers rangés dans le coffre R2, un lien est une fiche qui
   montre la porte. */
const TYPES={
  diagramme:{nom:'Code',      pl:'Codes', accept:'', icone:'<path d="M4 4h6v6H4zM14 4h6v6h-6zM9 14h6v6H9zM7 10v2h10v-2M12 12v2"/>'},
  image:    {nom:'Image',     pl:'Images',     accept:'image/*', icone:'<path d="M3 5h18v14H3zM3 16l5-5 4 4 3-3 6 6"/><circle cx="8.5" cy="9" r="1.5"/>'},
  pdf:      {nom:'PDF',       pl:'PDF',        accept:'application/pdf', icone:'<path d="M6 3h8l4 4v14H6zM14 3v4h4M9 13h6M9 17h6"/>'},
  lien:     {nom:'Lien',      pl:'Liens',      accept:'', icone:'<path d="M10 13a4 4 0 0 0 6 .5l2-2a4 4 0 0 0-6-6l-1 1M14 11a4 4 0 0 0-6-.5l-2 2a4 4 0 0 0 6 6l1-1"/>'}
};
const typeDe=r=>TYPES[r&&r.type]?r.type:'lien';

/* ── LES MARQUES ──
   L'espèce dit comment le contenu est rangé ; la MARQUE dit ce qu'il est
   pour le lecteur (article, diagramme, livre, cours, parcours…). La page la
   devine d'après le contenu, chaque skill laissant dans sa page une
   signature reconnaissable, et la fiche garde cette marque devinée. */
const MARQUES={
  article:  {nom:'Article',  icone:'<path d="M6.5 3.5h8l3 3v14h-11z"/><path d="M9.5 11h5M9.5 14.5h5M9.5 7.5h2.5"/>'},
  diagramme:{nom:'Diagramme',icone:'<circle cx="12" cy="4.8" r="2.3"/><circle cx="5" cy="18.6" r="2.3"/><circle cx="19" cy="18.6" r="2.3"/><circle cx="12" cy="13.2" r="1.6"/><path d="M12 7.1v4.5M10.7 14.2l-4.1 2.8M13.3 14.2l4.1 2.8"/>'},
  livre:    {nom:'Livre',    icone:'<path d="M12 6.4C9.9 4.9 6.9 4.3 3.2 4.7v13.6c3.7-.4 6.7.2 8.8 1.7 2.1-1.5 5.1-2.1 8.8-1.7V4.7c-3.7-.4-6.7.2-8.8 1.7zM12 6.4V20"/>'},
  cours:    {nom:'Cours',    icone:'<path d="M2.5 9L12 4.6 21.5 9 12 13.4z"/><path d="M6.3 10.9v4.6c1.4 1.6 3.4 2.4 5.7 2.4s4.3-.8 5.7-2.4v-4.6"/><path d="M21.5 9v5.6"/>'},
  parcours: {nom:'Parcours', icone:'<circle cx="5" cy="18.8" r="2.1"/><path d="M7.1 18.8h7.4a3.2 3.2 0 0 0 0-6.4h-5a3.2 3.2 0 0 1 0-6.4h6"/><path d="M16.5 3.2v5.6M16.5 3.2h4.3l-1.2 1.4 1.2 1.4h-4.3"/>'},
  carte:    {nom:'Carte',    icone:'<path d="M3 6.2l6-2.2 6 2.2 6-2.2v13.8l-6 2.2-6-2.2-6 2.2zM9 4v13.8M15 6.2V20"/>'},
  image:    {nom:'Image',    icone:'<rect x="3" y="4.8" width="18" height="14.4" rx="1"/><path d="M3 16l5-5 4 4 3-3 6 6"/><circle cx="8.6" cy="9.2" r="1.5"/>'}
};
function devineMarque(r){
  const t=typeDe(r);
  if(t==='image')return 'image';
  if(t!=='diagramme')return '';
  /* le contenu n'est chargé qu'à l'ouverture : la liste lit la marque devinée
     à l'enregistrement */
  if(typeof r.code!=='string'||!r.code)return r.marqueDevinee||'';
  const c=r.code;
  /* Le bloc lv-progression est la signature la plus sûre : le cours y range
     ses « acquis », le parcours ses « sujets ». Les clés de stockage
     reconnaissent les fichiers qui n'ont pas ce bloc. */
  const bloc=(c.match(/<script\b[^>]*\bid=["']lv-progression["'][^>]*>([\s\S]*?)<\/script>/i)||[])[1]||'';
  if(/"acquis"/.test(bloc))return 'cours';
  if(/"sujets"/.test(bloc))return 'parcours';
  if(c.indexOf('cours-html:')>=0)return 'cours';
  if(c.indexOf('parcours-etude:')>=0)return 'parcours';
  if(c.indexOf('id="toc"')>=0||c.indexOf('class="tocbtn"')>=0)return 'livre';
  if(c.indexOf('diag-etat-')>=0||c.indexOf('data-name=')>=0)return 'diagramme';
  return '';
}
/* sur cette page, tout est article : le rangement par l'IA (commun/ia.js)
   lit ce nom */
function marqueDe(){
  return 'article';
}

// ════════ RANGEMENT ════════
/* Une rubrique vaut {id, nom, parent}. Le parent est l'identifiant d'une
   autre rubrique, ou une chaîne vide au premier niveau : la profondeur se
   lit, elle n'est pas écrite. Le premier niveau est une CATÉGORIE, ceux
   d'en dessous des sections. Cinq niveaux au plus : un rangement plus
   profond coûte plus à tenir qu'il ne fait gagner. Un article porte son
   rub ; s'il pointe une rubrique disparue, il retombe hors catégorie. */
const RUB_MAX=5;
const motRub=id=>niveau(id)<=1?'catégorie':'section';
const rubDe=id=>S.rubs.find(r=>r.id===id)||null;
/* (fonctions communes : voir commun/rubriques.js, posé par le build) */
/* ── L'ORDRE DES ARTICLES ──
   Un article peut porter un rang (ordre, un nombre) : à un même endroit,
   ceux qui en ont un passent d'abord, dans cet ordre ; les autres suivent,
   du plus récent au plus ancien. Le rang se pose par glisser-déposer. */
const rangDe=a=>(typeof a.ordre==='number'&&isFinite(a.ordre))?a.ordre:null;
function triRessources(l){
  return l.slice().sort((a,b)=>{
    const ra=rangDe(a), rb=rangDe(b);
    if(ra!==null&&rb!==null&&ra!==rb)return ra-rb;
    if(ra!==null&&rb===null)return -1;
    if(ra===null&&rb!==null)return 1;
    return String(b.maj||b.cree||'').localeCompare(String(a.maj||a.cree||''));
  });
}
function ressourcesDe(rid){return triRessources(S.liste.filter(a=>(rubValide(a.rub)?a.rub:'')===(rid||'')));}
function compteRub(rid){return descendance(rid).reduce((n,x)=>n+ressourcesDe(x).length,0);}
/* Rien ne se déplie : on ENTRE dans une rubrique. La position vit dans
   l'adresse (voir vaVers) : le bouton « précédent » remonte d'un cran. */
/* On n'écrit la liste des rubriques qu'après l'avoir lue : sinon une lecture
   ratée (hors ligne, erreur passagère) ferait repartir de zéro et le premier
   enregistrement effacerait tout le rangement. */
let RUBS_LUES=false;
/* ── CE QUE LA PAGE SAIT DÉJÀ, ET CE QU'ELLE ATTEND ENCORE ──
   On note ce qui est arrivé : qui regarde, le rangement, la liste. Tant
   qu'il manque une pièce, la page montre le cercle de chargement au lieu d'affirmer
   une absence qu'elle ne connaît pas. */
let AUTH_VU=false, LISTE_LUE=false, LISTE_ERR=false, RUBS_ERR=false;

  if(!AUTH_VU)return false;

   (commun/stockage.js) ; un fichier plus ancien, encore découpé en
   tranches dans Firestore, se relit toujours. */
const mcol=()=>db.collection('users/'+S.uid+'/art_medias');
const CACHE=new Map();
const BLOBS=new Map();

function poids(o){
  o=Number(o)||0;
  if(o<1024)return o+' o';
  if(o<1024*1024)return Math.round(o/1024)+' Ko';
  return (o/1048576).toFixed(o<10485760?1:0)+' Mo';
}
/* ── TITRE ET EXTRAIT VIENNENT DE L'ARTICLE ──
   Un article de la skill article-html porte sa question en grand titre et
   commence par un bloc « En bref ». La rangée de la liste reprend les deux.
   Le titre : le premier grand titre, sinon le titre de la page, sinon le nom
   du fichier. L'extrait : « En bref », sinon le premier vrai paragraphe.
   Le fichier HTML déposé est lu comme du texte et remplit la zone du code,
   comme un collage (Emmanuel ne veut pas copier-coller à chaque fois). */
const proText=s=>String(s||'').replace(/\s+/g,' ').trim();
function docDuCode(txt){
  const d=new DOMParser().parseFromString(String(txt||''),'text/html');
  d.querySelectorAll('script,style,noscript,template').forEach(e=>e.remove());
  return d;
}
function extraitDuCode(txt){
  try{
    const d=docDuCode(txt);
    let ex='';
    /* le bloc « En bref » : l'étiquette, puis son texte */
    const lab=[...d.body.querySelectorAll('*')].find(e=>!e.children.length&&/^en bref$/i.test(proText(e.textContent)));
    if(lab){
      let bloc=lab.parentElement;
      while(bloc&&bloc!==d.body&&proText(bloc.textContent).length<=proText(lab.textContent).length+3)bloc=bloc.parentElement;
      if(bloc&&bloc!==d.body){
        lab.remove();
        /* paragraphe par paragraphe, une espace entre eux */
        const w=d.createTreeWalker(bloc,NodeFilter.SHOW_TEXT), bouts=[];
        while(w.nextNode())bouts.push(w.currentNode.nodeValue);
        ex=proText(bouts.join(' '));
      }
    }
    if(!ex)ex=[...d.querySelectorAll('p')].map(e=>proText(e.textContent)).find(s=>s.length>=40)||'';
    return ex.length>220?ex.slice(0,217).replace(/\s+\S*$/,'')+'…':ex;
  }catch(_){return '';}
}
function titreDuCode(txt){
  try{
    const d=docDuCode(txt);
    const h=d.querySelector('h1'), t=d.querySelector('title');
    return proText(h&&h.textContent)||proText(t&&t.textContent)||'';
  }catch(_){return '';}
}
async function chargeCode(f){
  if(!f||!S.res)return;
  const dit=m=>{const e=$('dep-code-etat');if(e)e.textContent=m;};
  const nom=f.name||'';
  if(!/\.(html?|svg|txt)$/i.test(nom)&&!/^(text\/|image\/svg)/.test(f.type||'')){lvInfo('Ce fichier n’est pas une page HTML.');return;}
  if(f.size>CODE_MAX){lvInfo('Ce fichier dépasse 300 Mo. Allégez-le.');return;}
  let txt='';
  try{txt=await f.text();}catch(e){lvInfo('Ce fichier n’a pas pu être lu.');return;}
  if(S.res.code&&S.res.code.trim()&&S.res.code!==txt){
    if(!await lvConfirm('Remplacer le code actuel par celui de « '+nom+' » ?'))return;
  }
  S.res.code=txt;
  const co=$('f-code'); if(co)co.value=txt;
  const ti=$('ed-titre'), vide=!!ti&&!ti.value.trim();
  if(vide){const auto=titreDuCode(txt)||nom.replace(/\.[^.]+$/,'').replace(/[-_]+/g,' ').trim();ti.value=auto;S.res.titre=auto;autoHauteur(ti);}
  marqueSale();
  dit(nom+'  ·  '+poids(f.size));
  majRenommer();
}
/* ── RENOMMER AVEC L'IA ──
   Au dépôt, l'article prend le titre écrit dans sa page, ou le nom du
   fichier. L'IA ne le renomme que par l'icône au bout du champ du titre
   (Emmanuel : « au lieu que l'IA renomme automatiquement, un bouton pour
   qu'on puisse renommer avec l'IA »). Le bouton ne paraît que lorsqu'il y
   a une page à lire. */
function majRenommer(){
  const b=$('b-renommer'); if(b)b.hidden=!(S.res&&S.res.code&&S.res.code.trim());
}
async function renommeIA(){
  const b=$('b-renommer'), cible=S.res, code=cible&&cible.code;
  if(!b||!code||!code.trim()||b.disabled)return;
  b.disabled=true; const mot=b.innerHTML; b.innerHTML=LV_ROUE_NOMME;
  const r=await lvNomme('articles',code,'');
  b.disabled=false; b.innerHTML=mot;
  const t=r&&String(r.titre||'').trim(), ti=$('ed-titre');
  if(!t){lvInfo('L’IA n’a pas pu proposer de titre. Réessayez.');return;}
  if(S.res!==cible||!ti)return;
  ti.value=t; cible.titre=t; autoHauteur(ti); marqueSale();
}
/* Le fichier téléchargé porte le titre de l'article, débarrassé des signes
   que les systèmes refusent dans un nom de fichier. */
function nomFichier(titre,ext){
  const n=String(titre||'').replace(/[\\/:*?"<>|\u0000-\u001f]+/g,' ').replace(/\s+/g,' ').trim().replace(/[. ]+$/,'');
  return (n||'Article')+ext;
}
/* le contenu est lu à la demande, puis la ressource s'ouvre en plein écran ;
   « seulSiVue » : ouverture automatique, qui n'a lieu que si l'on est
   toujours sur cette fiche quand le contenu arrive */
function ouvrePleinCharge(a,seulSiVue,zone){
  const echec=mot=>{
    if(zone&&S.vu===a.id){
      zone.innerHTML='<div class="lv-ouverture"><p>'+esc(mot)+'</p><button type="button" class="res-rouvrir">Réessayer</button></div>';
      zone.querySelector('button').onclick=()=>{zone.innerHTML='<div class="lv-attente"><span class="lv-roue" role="status" aria-label="Chargement"></span></div>';ouvrePleinCharge(a,seulSiVue,zone);};
    }else lvInfo(mot);
  };
  contenuDe(a).then(code=>{
    if(seulSiVue&&S.vu!==a.id)return;
    if(!code){echec('Cette page est vide.');return;}
    ouvrePlein(a);
  }).catch(e=>{ console.warn('contenu',e); echec('Le contenu n’a pas pu être chargé. Vérifiez la connexion, puis réessayez.'); });
}
/* ── TÉLÉCHARGER PASSE PAR LE « ⋯ » ──
   Ni la fiche ni le plein écran n'ont de bouton « Télécharger » : on
   télécharge depuis les trois points, ou par le mode Choisir. Un code se
   télécharge en page HTML, une image ou un PDF tel quel. */
function telechargeable(a){
  const t=typeDe(a);
  if(t==='diagramme')return !!(a.codeTaille||a.code||typeof a.code!=='string');
  return (t==='image'||t==='pdf')&&!!a.media;
}
function nomTelecharge(a){
  const t=typeDe(a);
  if(t==='diagramme')return nomFichier(a.titre,'.html');
  const ext=((a.nom||'').match(/\.[a-z0-9]{2,5}$/i)||[t==='pdf'?'.pdf':''])[0];
  return a.titre?nomFichier(a.titre,ext):(a.nom||'article');
}
async function telechargeRessource(a){
  if(!a)return;
  if(typeDe(a)==='diagramme'){ telechargeCode(a); return; }
  try{
    const u=await chargeMedia(a.media);
    const l=document.createElement('a');
    l.href=u; l.download=nomTelecharge(a); l.style.display='none';
    document.body.appendChild(l); l.click(); l.remove();
  }catch(e){ lvInfo('Ce fichier n’a pas pu être chargé. Vérifiez la connexion, puis réessayez.'); }
}
async function telechargeCode(a){
  if(!a)return;
  try{ await contenuDe(a); }catch(e){ lvInfo('Le contenu n’a pas pu être chargé. Vérifiez la connexion, puis réessayez.'); return; }
  if(!a.code)return;
  const u=URL.createObjectURL(new Blob([a.code],{type:'text/html;charset=utf-8'}));
  const l=document.createElement('a');
  l.href=u; l.download=nomFichier(a.titre,'.html'); l.style.display='none';
  document.body.appendChild(l); l.click(); l.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
}
async function chargeMedia(id){
  if(CACHE.has(id))return CACHE.get(id);
  const url=await lvMediaAdresse(mcol(),id);
  CACHE.set(id,url);
  return url;
}
/* Un PDF ne s'ouvre pas de façon fiable depuis une adresse « data: ».
   On repasse donc par un vrai objet binaire, que le lecteur du navigateur
   sait afficher comme un fichier ordinaire. */
function blobDe(url){
  if(!/^data:/.test(url))return url;
  if(BLOBS.has(url))return BLOBS.get(url);
  const i=url.indexOf(','), mime=(url.slice(0,i).match(/^data:([^;]+)/)||[])[1]||'application/octet-stream';
  const bin=atob(url.slice(i+1)), u=new Uint8Array(bin.length);
  for(let k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);
  const b=URL.createObjectURL(new Blob([u],{type:mime}));
  BLOBS.set(url,b);
  return b;
}
async function effaceMedia(id){
  if(!id)return;
  try{ await lvMediaEfface(mcol(),id); CACHE.delete(id); }
  catch(e){console.warn('effacement fichier',e);}
}

// ════════ CADRE ISOLÉ ════════
/* Le code de l'auteur tourne dans un cadre isolé : sandbox SANS
   allow-same-origin, donc il ne peut lire ni les comptes, ni les données, ni
   le reste de la page. Il annonce sa hauteur par message, on l'écoute. */
function pageCadre(code){
  return '<!doctype html><html lang="fr"><head><meta charset="utf-8">'
    +'<meta name="viewport" content="width=device-width,initial-scale=1">'
    +'<style>html,body{margin:0;padding:0;background:#000;color:#fff;'
    +'font-family:Georgia,serif}*{box-sizing:border-box}'
    /* ── L'ASCENSEUR DU CADRE PORTE L'ACCENT DU SITE ──
       La feuille de style du site n'atteint pas le cadre : on lui pose les
       mêmes règles qu'aux pages (filet mince à la couleur d'accent, fond
       transparent) et un color-scheme sombre pour ce que le navigateur
       dessine de lui-même. */
    +'html{color-scheme:dark}'
    +'*{scrollbar-width:thin;scrollbar-color:rgba(239,230,207,.35) transparent}'
    +'::-webkit-scrollbar{width:10px;height:10px}'
    +'::-webkit-scrollbar-track{background:transparent}'
    +'::-webkit-scrollbar-thumb{background:rgba(239,230,207,.35);background-clip:content-box;border:3px solid transparent;border-radius:99px}'
    +'::-webkit-scrollbar-thumb:hover{background:rgba(239,230,207,.6);background-clip:content-box;border:3px solid transparent}'
    /* le texte du diagramme reste sélectionnable au doigt : sur mobile, la
       copie à l'ancienne, par appui long, doit rester possible */
    +'body{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}'
    /* Posé dans la page, le cadre a la hauteur exacte de son contenu : un
       ascenseur n'y trahirait qu'un écart de mesure, et sous Windows il
       volerait quinze pixels de largeur. On le retire. */
    +'html{overflow:hidden}'
    /* Le contenu est enfermé dans une boîte qu'on peut mesurer. display:flow-root
       retient les marges de ses enfants, sinon le bas serait coupé. */
    +'#lv-mesure{display:flow-root}</style></he'+'ad><body>'
    +'<div id="lv-mesure">'+code+'</div>'
    /* le cadre dit ce qui y est sélectionné : « Demander à l'IA »
       (commun/question.js) */
    +(typeof QA_CADRE==='string'?QA_CADRE:'')
    +'<scr'+'ipt>(function(){'
    /* ── LA HAUTEUR EST CELLE DU DERNIER PIXEL VU ──
       Ni la hauteur de la page du cadre (qui ne descend jamais sous celle de
       sa fenêtre), ni la boîte du contenu (qui compte les marges basses). La
       mesure descend l'arbre en emportant la limite de ce qui se voit :
       chaque élément qui coupe ce qui dépasse abaisse cette limite, si bien
       qu'une section repliée ne compte pas son contenu caché. Un sous-arbre
       masqué (display ou visibility) sort du compte. */
    +'var w=document.getElementById("lv-mesure"),dernier=-1,demande=0;'
    +'function scrute(e,coupe){var cs=getComputedStyle(e);'
    +'if(cs.display==="none"||cs.visibility==="hidden")return 0;'
    +'var r=e.getBoundingClientRect(),b=Math.min(r.bottom,coupe),m=0,i,v,k;'
    +'if(r.width||r.height)m=b;'
    +'if(cs.overflowY!=="visible"&&r.bottom<coupe)coupe=r.bottom;'
    +'k=e.children;for(i=0;i<k.length;i++){v=scrute(k[i],coupe);if(v>m)m=v;}'
    +'return m;}'
    +'function bas(){var m=0,k=w.children,i,v,c=1/0;'
    +'for(i=0;i<k.length;i++){v=scrute(k[i],c);if(v>m)m=v;}'
    +'return m+(window.pageYOffset||0);}'
    +'function h(){if(!w)return;var n=Math.ceil(bas());'
    +'if(n<=0)n=Math.ceil(Math.max(w.getBoundingClientRect().height,w.scrollHeight));'
    /* Le recensement des éléments collants est demandé à chaque remaniement,
       même à hauteur égale : une barre qui apparaît déplace les titres de
       sections sans changer la hauteur. */
    +'planRecense();'
    +'if(n===dernier)return;dernier=n;'
    /* La boîte prend aussi cette hauteur : une marge basse invisible
       rendrait sinon la page du cadre défilable de quelques pixels. */
    +'w.style.height=n+"px";demande=n;'
    /* ── QUI DÉFILE, ET QUAND ──
       Posé dans la page, le cadre a la hauteur de son contenu et ne défile
       pas. En PLEIN ÉCRAN, le contenu dépasse l'écran et c'est le cadre qui
       défile. Il le voit seul en comparant la hauteur mesurée à celle de sa
       fenêtre. */
    +'document.documentElement.style.overflow=(n>window.innerHeight+1)?"auto":"hidden";'
    +'try{parent.postMessage({lvHaut:n},"*");}catch(e){}}'
    /* ── CE QUI COLLE EN HAUT SUIT LA LECTURE ──
       Posé dans la page, le cadre ne défile pas : ses éléments « collants »
       (barre « Explorer », titres de sections) n'auraient rien à quoi
       s'accrocher. La page lui envoie donc la hauteur de contenu déjà passée
       sous le bord haut de la lecture ; le cadre reconnaît seul ses éléments
       collants et les fait glisser d'autant, sans les laisser sortir de leur
       bloc, comme le ferait le navigateur. Le mouvement passe par une
       translation, pour rester fluide. */
    +'var vueHaut=0,collants=[],attente=0;'
    /* ── CHAQUE RECENSEMENT REND SA PLACE À CE QUI NE COLLE PLUS ──
       Un titre de section ne colle que tant que sa section est ouverte. Le
       recensement remet donc à zéro toutes les translations posées avant de
       refaire sa liste : un titre replié retrouve sa vraie ligne, ceux qui
       collent encore reçoivent de nouveau la leur. */
    +'function recense(){var j;for(j=0;j<collants.length;j++){'
    +'collants[j].e.style.transform="";collants[j].d=0;}'
    +'collants=[];var l=w.getElementsByTagName("*"),i,cs,t;'
    +'for(i=0;i<l.length;i++){cs=getComputedStyle(l[i]);'
    +'if(cs.position==="sticky"){t=parseFloat(cs.top);'
    +'if(t===t)collants.push({e:l[i],t:t,d:0});}}'
    +'colle();}'
    /* Le recensement se refait après chaque changement de hauteur, c'est-à-dire
       à chaque ouverture ou repli de section : un titre ne devient collant que
       lorsque sa section s'ouvre. Le délai laisse l'animation finir et ramène
       toute une cascade de mesures à un seul parcours. */
    +'function planRecense(){clearTimeout(attente);attente=setTimeout(recense,180);}'
    /* La position naturelle se retrouve en retirant la translation déjà posée :
       une translation ne change rien à la mise en page, le bloc parent garde
       donc sa vraie boîte et sert de butée basse. */
    +'function colle(){var i,s,e,p,r,pr,nat,d,max;'
    +'for(i=0;i<collants.length;i++){s=collants[i];e=s.e;p=e.parentElement;'
    +'if(!p)continue;r=e.getBoundingClientRect();nat=r.top-s.d;'
    +'pr=p.getBoundingClientRect();d=vueHaut+s.t-nat;if(d<0)d=0;'
    +'max=pr.bottom-nat-r.height;if(max<0)max=0;if(d>max)d=max;'
    +'if(d!==s.d){s.d=d;e.style.transform=d?("translateY("+d+"px)"):"";}}}'
    /* ── LA PAGE RÉPOND CE QU'ELLE A PU DONNER ──
       Elle plafonne la hauteur par prudence. Si le cadre a eu ce qu'il
       demandait, il verrouille son défilement ; s'il a eu moins, il le
       rouvre, et ce qui dépasse reste atteignable. */
    /* ── LA PLACE OÙ L'ON EN ÉTAIT ──
       En plein écran, seul le cadre sait où le lecteur s'est arrêté. Il le
       dit à la page, qui le garde ; à la réouverture, la page le lui rend et
       il s'y repose, en plusieurs tentatives, le temps que le contenu
       s'installe. Un nombre de pixels ne vaut que pour une même largeur
       d'écran : le cadre retient aussi un REPÈRE, l'élément qui passe au
       tiers de l'écran (hors barres collantes), désigné par son chemin, et la
       fraction de lui-même qui s'y trouve. Sur un écran d'une autre largeur,
       on ramène ce repère au même tiers (Emmanuel : « harmonise ça entre
       mobile et pc »). */
    +'var posVoulue=-1,posInfo=null,posDit=0;'
    +'function chemin(e){var p=[];while(e&&e!==w){var q=e.parentElement;if(!q)return null;p.unshift(Array.prototype.indexOf.call(q.children,e));e=q;}return e===w?p:null;}'
    +'function suit(p){var e=w,i;for(i=0;i<p.length;i++){e=e.children[p[i]];if(!e)return null;}return e;}'
    +'function colleDedans(e){while(e&&e!==w){var s=getComputedStyle(e).position;if(s==="sticky"||s==="fixed")return true;e=e.parentElement;}return false;}'
    +'function repere(){var H=window.innerHeight,X=window.innerWidth/2,f=[.3,.45,.6,.2],i,y,e,r,p;'
    +'for(i=0;i<f.length;i++){y=H*f[i];e=document.elementFromPoint(X,y);'
    +'if(!e||e===w||!w.contains(e)||colleDedans(e))continue;'
    +'r=e.getBoundingClientRect();if(r.height<1)continue;p=chemin(e);if(!p)continue;'
    +'return {p:p,f:(y-r.top)/r.height,v:f[i]};}return null;}'
    +'function ditPos(){posDit=0;var y=Math.round(window.pageYOffset||document.documentElement.scrollTop||0),a=null;'
    +'try{a=repere();}catch(e){}'
    +'try{parent.postMessage({lvPos:y,lvPosInfo:{y:y,l:window.innerWidth,h:document.documentElement.scrollHeight,a:a}},"*");}catch(e){}}'
    +'function planPos(){if(posDit)return;posDit=setTimeout(ditPos,220);}'
    +'window.addEventListener("scroll",planPos,{passive:true});'
    /* ── LE GESTE DU LECTEUR CLÔT LA REPRISE ──
       Son premier geste (molette, doigt, touche) met fin aux reprises de
       place : à partir de là, c'est lui qui mène. */
    +'var posGeste=0;'
    +'function siGeste(){posGeste=1;}'
    +'window.addEventListener("wheel",siGeste,{passive:true});'
    +'window.addEventListener("touchstart",siGeste,{passive:true});'
    +'window.addEventListener("keydown",siGeste);'
    +'function cible(){var i=posInfo;if(!i||!(i.l>0)||Math.abs(i.l-window.innerWidth)<=2)return posVoulue;'
    +'if(i.a&&i.a.p){var e=suit(i.a.p);if(e){var r=e.getBoundingClientRect();'
    +'if(r.height>0)return (window.pageYOffset||0)+r.top+i.a.f*r.height-i.a.v*window.innerHeight;}}'
    +'if(i.h>0)return i.y/i.h*document.documentElement.scrollHeight;return posVoulue;}'
    +'function reposeToi(){if(posGeste||posVoulue<0)return;var m=Math.max(0,document.documentElement.scrollHeight-window.innerHeight);'
    +'window.scrollTo(0,Math.max(0,Math.min(Math.round(cible()),m)));}'
    +'window.addEventListener("message",function(e){var d=e.data;if(!d)return;'
    +'if(typeof d.lvRevoir==="number"){posVoulue=d.lvRevoir;posInfo=d.lvRevoirInfo||null;reposeToi();'
    +'setTimeout(reposeToi,150);setTimeout(reposeToi,500);setTimeout(reposeToi,1200);return;}'
    +'if(d.lvVue&&typeof d.lvVue.haut==="number"){vueHaut=d.lvVue.haut;colle();return;}'
    +'if(typeof d.lvApplique!=="number")return;'
    +'document.documentElement.style.overflow=(d.lvApplique<demande-1)?"auto":"hidden";});'
    /* ── LES LIENS INTERNES DU CONTENU RESTENT CHEZ LUI ──
       Écrit par srcdoc, le cadre a pour adresse de base celle de LA PAGE : un
       lien « #ch13 » chargerait la page du site à la place du contenu. On
       intercepte donc ces liens et on amène la cible en haut de la lecture :
       en plein écran, le cadre défile lui-même ; posé dans la page, il
       demande à la page de défiler. */
    +'document.addEventListener("click",function(e){'
    +'if(e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;'
    +'var a=e.target&&e.target.closest?e.target.closest("a"):null;if(!a)return;'
    +'var h=a.getAttribute("href")||"";if(h.charAt(0)!=="#"||h.length<2)return;'
    +'var id=decodeURIComponent(h.slice(1));'
    +'var c=document.getElementById(id)||document.getElementsByName(id)[0];if(!c)return;'
    +'e.preventDefault();'
    +'var libre=document.documentElement.scrollHeight>window.innerHeight+1;'
    +'if(libre){c.scrollIntoView({block:"start"});}'
    +'else{try{parent.postMessage({lvAncre:Math.round(c.getBoundingClientRect().top+(window.pageYOffset||0))},"*");}catch(e2){}}'
    +'},false);'
    +'window.addEventListener("load",function(){h();recense();});'
    /* la fenêtre du cadre change de taille au passage en plein écran comme à
       la rotation de l'appareil : on remesure, et le défilement se rouvre ou
       se referme selon ce que le contenu demande */
    +'window.addEventListener("resize",function(){h();planRecense();});'
    +'setTimeout(h,120);setTimeout(h,600);setTimeout(recense,700);'
    /* ── QUI SURVEILLE QUOI ──
       La boîte est fermée à la hauteur mesurée et ne bouge plus : on
       surveille donc les éléments QU'ELLE CONTIENT. */
    +'if(window.ResizeObserver){var ro=new ResizeObserver(h),k;'
    +'for(k=0;k<w.children.length;k++)ro.observe(w.children[k]);'
    +'if(!w.children.length)ro.observe(w);}'
    /* ── LA COPIE PASSE PAR LA PAGE ──
       En bac à sable sans allow-same-origin, le cadre est d'origine opaque :
       le navigateur lui refuse le presse-papier sans rien dire. On intercepte
       l'appel et la page, qui a le droit, fait le travail. La tentative
       directe est gardée : là où elle passe, elle passe. */
    +'function relais(t){try{parent.postMessage({lvCopie:String(t)},"*");}catch(e){}}'
    /* ── LA COPIE SE FAIT SUR PLACE, DANS LE GESTE, *ET* PAR LA PAGE ──
       Le relais arrive par message, après le geste : certains navigateurs
       (Brave) refusent alors le presse-papier à la page. On copie donc aussi
       ici, pendant le clic, par la vieille commande de copie. LES DEUX SONT
       TENTÉES À CHAQUE FOIS : la vieille commande répond « réussi » même
       quand le navigateur a bloqué l'écriture, sa réponse ne dit donc rien.
       Le champ de copie se pose à la hauteur du doigt, et le focus est
       demandé sans défilement : sélectionner un champ l'amène à l'écran, et
       un champ posé ailleurs ferait bouger la page. */
    +'var lvY=0;'
    +'function lvPose(e){var y=e&&e.pageY;if(typeof y==="number"&&y>=0)lvY=y;}'
    +'document.addEventListener("pointerdown",lvPose,true);'
    +'document.addEventListener("click",lvPose,true);'
    +'function surPlace(t){try{var z=document.createElement("textarea");z.value=String(t);'
    +'z.setAttribute("readonly","");'
    /* rendu mais invisible : masqué pour de bon, rien ne serait sélectionnable ;
       16px sinon iOS zoome de lui-même au moment de la sélection */
    +'z.style.cssText="position:absolute;left:0;width:1px;height:1px;padding:0;border:0;font-size:16px;opacity:0";'
    +'z.style.top=Math.max(0,lvY-8)+"px";'
    +'document.body.appendChild(z);var ok=false;'
    +'try{try{z.focus({preventScroll:true});}catch(e2){z.focus();}'
    +'if(z.setSelectionRange)z.setSelectionRange(0,999999);'
    +'var s=window.getSelection(),r=document.createRange();r.selectNodeContents(z);'
    +'s.removeAllRanges();s.addRange(r);ok=document.execCommand("copy");'
    +'s.removeAllRanges();}catch(e){}'
    +'document.body.removeChild(z);return ok;}catch(e){return false;}}'
    +'try{var nat=(navigator.clipboard&&navigator.clipboard.writeText)?navigator.clipboard.writeText.bind(navigator.clipboard):null;'
    +'Object.defineProperty(navigator,"clipboard",{configurable:true,value:{'
    +'writeText:function(t){var v=String(t);surPlace(v);relais(v);'
    +'if(nat)return nat(v).catch(function(){return undefined;});return Promise.resolve();},'
    +'readText:function(){return Promise.reject(new Error("indisponible"));}}});}catch(e){}'
    +'})();</scr'+'ipt>'
    /* Balise fermante coupée en deux : le build injecte son script sur la
       PREMIÈRE balise de fermeture du corps qu'il trouve dans le fichier. Ne
       pas la recoller, et ne jamais écrire cette balise en clair dans ce
       fichier, commentaires compris. */
    +'</bo'+'dy></html>';
}
/* Copie de secours, à l'ancienne : un champ posé hors champ, sélectionné, puis
   la commande de copie du navigateur. Il doit rester RENDU (ni display:none ni
   visibility:hidden), sinon rien n'est sélectionnable, et sa police à 16px, en
   dessous de quoi iOS zoome tout seul au moment de la sélection. */
function copieVieille(txt){
  try{
    const z=document.createElement('textarea');
    z.value=txt; z.readOnly=false; z.contentEditable='true';
    /* posé À LA HAUTEUR OÙ L'ON LIT, focus sans défilement : sélectionner
       un champ l'amène à l'écran, et la page ne doit pas bouger */
    z.style.cssText='position:absolute;left:-9999px;width:1px;height:1px;font-size:16px;opacity:0';
    z.style.top=(window.pageYOffset||document.documentElement.scrollTop||0)+'px';
    document.body.appendChild(z);
    try{z.focus({preventScroll:true});}catch(_){}
    const r=document.createRange(); r.selectNodeContents(z);
    const s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
    z.setSelectionRange(0,999999);
    document.execCommand('copy');
    s.removeAllRanges(); document.body.removeChild(z);
    return true;
  }catch(e){return false;}
}
/* Les messages du cadre : sa hauteur, sa place, son état, sa progression,
   ses copies. On ne répond qu'aux cadres de cette page : n'importe quel
   onglet peut envoyer un message, aucun ne doit pouvoir écrire dans le
   presse-papier par ce chemin. */
window.addEventListener('message',e=>{
  const d=e.data; if(!d)return;
  let cadre=null;
  document.querySelectorAll('iframe[data-diag]').forEach(f=>{if(f.contentWindow===e.source)cadre=f;});
  if(!cadre)return;
  /* une sélection dans le cadre : le bouton « Demander à l'IA » */
  if('lvSel' in d){const a=S.liste.find(x=>x.id===(cadre.dataset.res||S.vu));qaSelectionCadre(d.lvSel,cadre,a?a.titre:'','un article',a&&typeof a.code==='string'?a.code:'',a?{col:'art_code',id:a.id}:null);return;}
  /* Le cadre s'ouvre toujours en plein écran : il fait l'écran, la hauteur
     qu'il annonce ne le concerne pas, et le contenu fait glisser lui-même ce
     qui colle. */
  if(typeof d.lvHaut==='number')return;
  /* Le cadre posé dans la page ne défile pas lui-même : quand un lien interne
     de son contenu désigne un endroit plus bas, c'est la page qui porte la
     lecture jusque-là, sous la barre du site. */
  if(typeof d.lvAncre==='number'){
    const r=cadre.getBoundingClientRect();
    const y=r.top+(window.pageYOffset||0)+d.lvAncre-hautLecture()-8;
    window.scrollTo({top:Math.max(0,Math.round(y)),behavior:'smooth'});
    return;
  }
  if(typeof d.lvPos==='number'){
    const id=cadre.dataset.res;
    if(id&&cadre._rendu){
      const info=d.lvPosInfo&&typeof d.lvPosInfo==='object'?d.lvPosInfo:{y:d.lvPos};
      info.y=Math.max(0,Math.round(info.y||0));
      garde('pos',id,JSON.stringify(info));
    }
    return;
  }
  /* ── L'ÉTAT DU CONTENU EST GARDÉ PAR LA PAGE ──
     D'origine opaque, le cadre n'a pas de stockage local. Il envoie son état
     à la page, qui le garde par article et le lui rend à la réouverture. La
     page ne lit pas cet état : elle le range et le rend tel quel, si bien
     que chaque contenu y met ce qui lui est propre. */
  if(typeof d.lvEtat!=='undefined'&&d.lvEtat!==null){
    const id=cadre.dataset.res;
    /* tant que l'état gardé n'a pas été rendu au cadre, ce qu'il envoie n'est
       que son état de naissance : l'enregistrer effacerait la vraie reprise */
    if(id&&cadre._rendu)garde('etat',id,JSON.stringify(d.lvEtat));
    return;
  }
  if(d.lvEtatVoulu){ rendEtat(cadre); if(!cadre._voulu&&cadre._rends){cadre._voulu=true;cadre._rends();} return; }
  if(d.lvProgression&&typeof d.lvProgression==='object'){
    const id=cadre.dataset.res;
    if(id&&S.auteur)inscritProgression(id,d.lvProgression);
    return;
  }
  if(typeof d.lvCopie==='string')copiePresse(d.lvCopie);
});
/* L'état gardé pour un article, rendu au cadre qui le demande ou qui vient
   de s'ouvrir. */
function litEtat(id){
  if(!id)return null;
  try{return JSON.parse(lLit('etat',id)||'null');}catch(_){return null;}
}
function litPos(id){
  const v=lLit('pos',id);
  if(!v)return {y:0};
  try{const o=JSON.parse(v);
    if(typeof o==='number')return {y:Math.max(0,o)};
    if(o&&typeof o==='object')return Object.assign({y:0},o);
  }catch(_){}
  return {y:0};
}
function envoieEtat(cadre){
  if(!cadre||!cadre.dataset)return;
  const e=litEtat(cadre.dataset.res||'');
  if(!e)return;
  try{cadre.contentWindow.postMessage({lvEtat:e},'*');}catch(_){}
}
/* on attend l'état venu des autres appareils avant de répondre */
function rendEtat(cadre){
  if(!cadre)return;
  (cadre._pret||Promise.resolve()).then(()=>envoieEtat(cadre));
}

/* ── L'ÉTAT ET LA PLACE SUIVENT LE LECTEUR D'UN APPAREIL À L'AUTRE ──
   L'état d'un article et la place de lecture vivent sur l'appareil et dans
   le compte, une fiche par article (users/…/art_lecture/…), chaque valeur
   avec son heure. À l'ouverture, la plus récente des deux versions
   l'emporte. L'écriture vers le compte est groupée (une toutes les
   secondes et demie au plus) et part aussitôt quand la page se cache, se
   quitte ou qu'on revient aux articles. */
const LECT={att:{},minuteur:0};
function lLit(q,id){try{return localStorage.getItem('lv_art_'+q+'_'+id);}catch(_){return null;}}
function lMaj(q,id){return parseInt(lLit(q+'maj',id)||'0',10)||0;}
function lPose(q,id,val,maj){
  try{localStorage.setItem('lv_art_'+q+'_'+id,val);localStorage.setItem('lv_art_'+q+'maj_'+id,String(maj));}catch(_){}
}
const lecDoc=id=>db.doc('users/'+S.uid+'/art_lecture/'+id);
function garde(q,id,val){
  const t=Date.now();
  lPose(q,id,val,t);
  if(!S.uid)return;
  const a=LECT.att[id]||(LECT.att[id]={});
  a[q]=val; a[q+'Maj']=t;
  clearTimeout(LECT.minuteur);
  LECT.minuteur=setTimeout(pousseLecture,1500);
}
function pousseLecture(){
  clearTimeout(LECT.minuteur); LECT.minuteur=0;
  if(!S.uid)return;
  const att=LECT.att; LECT.att={};
  Object.keys(att).forEach(id=>{ lecDoc(id).set(att[id],{merge:true}).catch(()=>{}); });
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden')pousseLecture(); });
window.addEventListener('pagehide',pousseLecture);
function rapatrie(id){
  if(!id||!S.uid)return Promise.resolve();
  const lu=lecDoc(id).get().then(sn=>{
    if(!sn.exists)return;
    const d=sn.data()||{};
    ['etat','pos'].forEach(q=>{
      const m=+d[q+'Maj']||0;
      if(typeof d[q]==='string'&&m>lMaj(q,id))lPose(q,id,d[q],m);
    });
  }).catch(()=>{});
  /* hors ligne, on n'attend pas plus de deux secondes et demie */
  return Promise.race([lu,new Promise(r=>setTimeout(r,2500))]);
}

/* ── LA PROGRESSION EST ÉCRITE DANS LE FICHIER ──
   Emmanuel : « je vais mettre à jour le fichier parcours avec Claude, c'est
   pour ça que je veux que ce soit le fichier qui se modifie ».
   Un parcours ou un cours porte un bloc réservé à la progression, le
   script JSON d'identifiant lv-progression. Quand il envoie
   {lvProgression:…}, la page réécrit CE BLOC SEUL dans le code ; le reste
   du fichier n'est jamais touché. Le parcours y range ses « sujets », le
   cours ses « acquis ». Le fichier téléchargé porte donc les coches.
   L'écriture relit le code dans le nuage (transaction) : un appareil qui a
   gardé une ancienne version n'écrase jamais la nouvelle. */
const PROG={att:{},minuteur:0};
const PROG_BLOC=/<script\b[^>]*\bid=["']lv-progression["'][^>]*>[\s\S]*?<\/script>/i;
const PROG_ETATS=['en-cours','termine','a-revoir'];
function progressionPropre(p){
  const s={};
  const src=p&&p.sujets&&typeof p.sujets==='object'?p.sujets:{};
  Object.keys(src).forEach(k=>{
    if(/^[\w.-]{1,80}$/.test(k)&&PROG_ETATS.indexOf(src[k])>=0)s[k]=src[k];
  });
  const q={maj:Math.max(0,Math.round(+p.maj||Date.now()))};
  if(p&&p.sujets&&typeof p.sujets==='object')q.sujets=s;
  if(p&&p.acquis&&typeof p.acquis==='object'){
    const a={};
    Object.keys(p.acquis).forEach(k=>{ if(/^[\w.-]{1,80}$/.test(k)&&p.acquis[k]===true)a[k]=true; });
    q.acquis=a;
  }
  if(!q.sujets&&!q.acquis)q.sujets={};
  return q;
}
function poseProgression(code,p){
  const bloc='<script type="application/json" id="lv-progression">\n'
    +JSON.stringify(p,null,1).replace(/</g,'\\u003c')+'\n<\/script>';
  if(PROG_BLOC.test(code))return code.replace(PROG_BLOC,()=>bloc);
  const i=code.search(/<\/head>/i);
  if(i>=0)return code.slice(0,i)+bloc+'\n'+code.slice(i);
  return bloc+'\n'+code;
}
function inscritProgression(id,brut){
  const p=progressionPropre(brut);
  /* sur place d'abord : le téléchargement qui suit porte déjà les coches */
  const a=S.liste.find(x=>x.id===id);
  if(a&&typeof a.code==='string'&&a.code){ a.code=poseProgression(a.code,p); CODES.set(id,a.code); }
  if(S.res&&S.res.id===id&&typeof S.res.code==='string'&&S.res.code&&!S.sale){
    S.res.code=poseProgression(S.res.code,p);
    const co=$('f-code'); if(co)co.value=S.res.code;
  }
  PROG.att[id]=p;
  clearTimeout(PROG.minuteur);
  PROG.minuteur=setTimeout(pousseProgression,1500);
}
function pousseProgression(){
  clearTimeout(PROG.minuteur); PROG.minuteur=0;
  if(!S.uid)return;
  const att=PROG.att; PROG.att={};
  Object.keys(att).forEach(id=>{
    if(SUPPRIMES.has(id))return;
    const p=att[id];
    let neu='';
    let gros=false;
    db.runTransaction(async tx=>{
      neu=''; gros=false;
      const r=await tx.get(ccol().doc(id));
      if(!r.exists)return;
      const m=r.data()||{};
      /* un contenu dans le coffre ou en tranches suit le chemin des gros
         contenus, plus bas */
      if(typeof m.code!=='string'||m.r2){ gros=!!(m.n||m.r2); return; }
      const code=m.code;
      if(!code)return;
      const n=poseProgression(code,p);
      if(n===code)return;
      if(octets(n)>CODE_SEUL){ gros=true; return; }
      tx.set(ccol().doc(id),{code:n});
      tx.update(acol().doc(id),{codeTaille:octets(n)});
      neu=n;
    }).then(async()=>{
      if(gros){
        const code=await litCode(ccol(),id);
        if(!code)return;
        const n=poseProgression(code,p);
        if(n===code||octets(n)>CODE_MAX)return;
        await ecritCode(ccol(),id,n,lot=>lot.update(acol().doc(id),{codeTaille:octets(n)}));
        neu=n;
      }
      if(!neu)return;
      CODES.set(id,neu);
      const a=S.liste.find(x=>x.id===id);
      if(a){ a.code=neu; a.codeTaille=new Blob([neu]).size; }
    }).catch(e=>{
      /* ratée (hors ligne) : elle repartira avec la prochaine coche, sauf si
         une plus récente attend déjà */
      console.warn('progression',id,e);
      if(!PROG.att[id])PROG.att[id]=p;
    });
  });
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden')pousseProgression(); });
window.addEventListener('pagehide',pousseProgression);

function carteRessource(r){
  /* L'article s'ouvre en page HTML, mais dans la liste il reste une rangée
     (Emmanuel : « garde le menu comme avant ») : la question en titre, le

  const titre=(r.titre||'').trim(), ex=String(r.extrait||'').trim();

    +(ex?'<div class="art-extrait">'+esc(ex)+'</div>':'')
