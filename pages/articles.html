/* ── OÙ L'ON EST ──
   Une seule variable dit tout : l'identifiant de la catégorie ou de la
   section ouverte, vide à la racine. Elle vit aussi dans l'adresse, donc le
   bouton « précédent » du navigateur remonte d'un cran. */
function ici(){ return rubValide(S.ouLa) ? S.ouLa : ''; }
function vaVers(id){
  S.ouLa = id || ''; S.vu='';
  const cible = S.ouLa ? '#d/' + S.ouLa : '';
  if((location.hash||'') !== cible){ try{ history.pushState(null,'',cible||location.pathname); }catch(_){} }
  /* on revient toujours à l'écran de la liste : un maillon du fil d'Ariane
     peut se cliquer depuis un article ouvert */
  vue('liste');
}
function majFil(){
  const f=$('fil'); if(!f)return;
  const bouts=[]; let r=rubDe(ici()), garde=0;
  while(r&&garde++<8){bouts.unshift(r);r=r.parent?rubDe(r.parent):null;}
  /* Le fil n'aligne que le chemin qui mène à l'endroit où l'on est, chaque
     maillon ramenant d'un clic. L'endroit courant devient le titre, en
     grand. À la racine, ni fil ni grand titre : le petit intitulé
     « Articles » suffit. */
  let h='<span data-va="">Articles</span>';
  bouts.slice(0,-1).forEach(x=>{ h+='<i>›</i><span data-va="'+esc(x.id)+'">'+esc(x.nom)+'</span>'; });
  f.innerHTML=bouts.length?h:'';
  $('titre-liste').textContent=bouts.length?bouts[bouts.length-1].nom:'Articles';
  const tete=$('titre-liste').parentElement; if(tete)tete.classList.toggle('dedans',!!bouts.length);
}
function rayonDe(r){
  const d=document.createElement('div');
  d.className='rub rub-1'+(S.pris.has('r:'+r.id)?' pris':''); d.dataset.va=r.id; d.dataset.cle='r:'+r.id;
  d.innerHTML='<div class="rub-tete" role="button" tabindex="0">'
    +'<span class="poignee" aria-label="Glisser pour déplacer" title="Glisser pour déplacer">⠿</span>'
    +'<span class="rub-nom">'+esc(r.nom)+'</span><span class="rub-n">'+compteRub(r.id)+'</span>'
    +'<span class="rub-menu" data-rmenu="'+esc(r.id)+'" role="button" tabindex="0" aria-label="Actions">⋯</span>'
    +'<span class="rub-chev">›</span></div>';
  return d;
}
function rendLister(){
  const ou=ici();
  majFil();
  /* le bouton dit ce qu'il va faire À CET ENDROIT : une catégorie à la
     racine, une section dès qu'on est entré quelque part */
  const bs=$('b-section'); if(bs)bs.textContent=ou?'+ Nouvelle section':'+ Nouvelle catégorie';
  const h=$('liste'); h.innerHTML='';
  /* les deux boutons de l'auteur arrivent AVEC la liste, pas avant : un
     élément qui se pose puis se déplace, c'est encore une page qui bouge */
  if(S.auteur)$('acts-liste').style.display=pretListe()?'':'none';
  if(S.auteur){majCorbBouton();majChoix();}
  if(!pretListe()){ h.innerHTML='<div class="lv-attente"><span class="lv-roue" role="status" aria-label="Chargement"></span></div>'; return; }
  const fils=enfants(ou), res=ressourcesDe(ou);
  if(!fils.length&&!res.length){
    if(LISTE_ERR&&S.auteur){ h.innerHTML='<div class="vide lv-vide">Les articles n’ont pas pu être lus.<br>Vérifiez la connexion, puis rechargez la page.</div>'; return; }
    h.innerHTML=ou
      ? '<div class="vide lv-vide">Rien ici pour l’instant.</div>'
      : '<div class="vide lv-vide"><span class="lv-vide-t">Rien encore.</span>Ajoute un article, ou crée d’abord une catégorie pour les ranger.</div>';
    return;
  }
  /* les sections d'abord, les articles dessous, tous en rangées */
  fils.forEach(r=>h.appendChild(rayonDe(r)));
  res.forEach(a=>h.appendChild(carteRessource(a)));
}

// ════════ ACTIONS DE RANGEMENT ════════
async function nouvelleRub(parent){
  const nom=await lvSaisie(parent?'Nouvelle section':'Nouvelle catégorie','',
    '',parent?'Ancien Testament, Genèse…':'Bible, Liturgie, Histoire…');
  if(!nom||!nom.trim())return null;
  const r={id:'r'+Date.now(),nom:nom.trim(),parent:parent||''};
  S.rubs.push(r); saveRubs(); rendLister();
  return r.id;
}
async function menuRub(id){
  const r=rubDe(id); if(!r)return;
  const freres=enfants(r.parent||''), i=freres.findIndex(x=>x.id===id);
  const e=[{cle:'renom',nom:'Renommer'}];
  if(niveau(id)<RUB_MAX)e.push({cle:'sous',nom:'Ajouter une section dedans'});
  /* « Ranger dans… » : une catégorie ou une section change de parent en
     une fois, avec tout ce qu'elle contient. */
  e.push({cle:'deplacer',nom:'Ranger dans…',note:r.parent&&rubValide(r.parent)?chemin(r.parent):'à la racine'});
  e.push({cle:'suppr',nom:'Mettre à la corbeille',danger:true});
  const c=await lvChoix(r.nom,e);
  if(!c)return;
  if(c==='deplacer'){await deplaceRub(id);return;}
  if(c==='renom'){
    const nom=await lvSaisie('Renommer','',r.nom,'Nom');
    if(nom&&nom.trim()){r.nom=nom.trim();saveRubs();rendLister();}
    return;
  }
  if(c==='sous'){await nouvelleRub(id);return;}

  if(c==='suppr'){
    /* Le contenu suit la rubrique, ou reste : Emmanuel le dit chaque fois
       qu'il y a quelque chose dedans. */
    const dedans=compteRub(id), mot=motRub(id);
    let avec=true;
    if(dedans){
      const q=await lvChoix(dedans>1?('Et les '+dedans+' articles rangés dedans ?'):'Et l’article rangé dedans ?',[
        {cle:'avec',nom:'Les mettre aussi à la corbeille',fort:true},
        {cle:'sans',nom:'Les laisser, sans catégorie'}
      ]);
      if(!q)return;
      avec=(q==='avec');
    }
    if(!await lvConfirm('Mettre cette '+mot+' à la corbeille'+(dedans&&avec?', avec son contenu':'')+' ?'))return;
    try{ await jetteRubrique(id,avec); majCorbBouton(); }
    catch(e){
      console.warn('corbeille',e);
      lvInfo('La mise à la corbeille a échoué. Vérifiez la connexion, puis réessayez.');
    }
  }
}
/* la hauteur d'un sous-arbre : 1 pour une section sans enfant, 2 si elle a
   des sections, etc. Sert à refuser un rangement qui dépasserait RUB_MAX. */
function hauteur(id){let h=1;enfants(id).forEach(e=>{h=Math.max(h,1+hauteur(e.id));});return h;}
async function deplaceRub(id){
  const r=rubDe(id); if(!r)return;
  const interdits=descendance(id), h=hauteur(id);
  const parent=r.parent&&rubValide(r.parent)?r.parent:'';
  const peut=cid=>niveau(cid)+h<=RUB_MAX;
  const e=[{cle:'r:',nom:'À la racine, comme catégorie',note:parent?'':'ici',fort:true}];
  e.push(...entreesArbre(interdits,peut,parent));
  const c=await lvChoix('Ranger « '+r.nom+' » dans…',e);
  if(!c)return;
  rubDans(id,c.slice(2));
}
/* ── L'ARBRE DU RANGEMENT ──
   Le choix d'un endroit se lit comme un sommaire : catégorie par catégorie,
   sections en retrait, « ici » sur l'endroit courant. Les entrées qu'on ne
   peut pas choisir restent visibles mais grisées, pour qu'on comprenne
   l'arbre entier. */
function entreesArbre(exclure,peut,courant){
  const e=[];
  const marche=(pid,niv)=>{
    enfants(pid).forEach(r=>{
      if(exclure&&exclure.indexOf(r.id)>=0)return;
      e.push({cle:'r:'+r.id,nom:r.nom,niv:niv,note:courant===r.id?'ici':'',off:!peut(r.id)});
      marche(r.id,niv+1);
    });
  };
  marche('',0);
  return e;
}
async function rangeRessource(id){
  const a=S.liste.find(x=>x.id===id); if(!a)return;
  const ou=rubValide(a.rub)?a.rub:'';
  /* en tête, laisser l'IA choisir l'endroit (commun/ia.js) */
  const e=[{cle:'ia_un',nom:'Laisser l’IA choisir',icone:'ia',fort:true},{cle:'r:',nom:'Sans catégorie',note:ou?'':'ici',fort:true}];
  e.push(...entreesArbre(null,()=>true,ou));
  e.push({cle:'neuve',nom:'+ Nouvelle catégorie',fort:true});
  const c=await lvChoix('Ranger « '+(a.titre||'Sans titre')+' » dans…',e);
  if(!c)return;
  if(c==='ia_un'){rangerUnIA('articles',id);return;}
  let cible=null;
  if(c==='neuve'){cible=await nouvelleRub('');if(!cible)return;}
  else cible=c.slice(2);
  try{
    /* en changeant d'endroit, l'article perd son rang : il rejoint la fin de
       sa nouvelle liste au lieu d'y prendre un rang au hasard */
    await acol().doc(id).set({rub:cible||'',ordre:null},{merge:true});
    a.rub=cible||''; a.ordre=null;
    if(S.res&&S.res.id===id){S.res.rub=cible||'';S.res.ordre=null;}
  }catch(e2){console.warn('rangement',e2);lvInfo('Le rangement n’a pas pu être enregistré.');}
  rendLister();
}

/* ── L'ORDRE S'ÉCRIT ──
   Une liste d'articles dans son nouvel ordre : chacun reçoit son rang, et
   seuls ceux dont le rang a changé sont réécrits, par lot. */
async function appliqueOrdre(nouvel){
  const changes=nouvel.filter((x,k)=>rangDe(x)!==k);
  if(!changes.length){rendLister();return;}
  changes.forEach(x=>{x.ordre=nouvel.indexOf(x);});
  rendLister();
  try{
    const lot=db.batch();
    changes.forEach(x=>lot.set(acol().doc(x.id),{ordre:x.ordre},{merge:true}));
    await lot.commit();
    if(S.res)S.res.ordre=(S.liste.find(x=>x.id===S.res.id)||{}).ordre;
  }catch(e2){console.warn('placement',e2);lvInfo('La place n’a pas pu être enregistrée. Vérifiez la connexion et réessayez.');}
}
/* poser un article à un rang donné parmi ses voisins */
function deplaceRessource(id,vers){
  const a=S.liste.find(x=>x.id===id); if(!a)return;
  const freres=ressourcesDe(rubValide(a.rub)?a.rub:'');
  const i=freres.findIndex(x=>x.id===id); if(i<0)return;
  const j=Math.max(0,Math.min(freres.length-1,vers)); if(j===i)return;
  const l=freres.slice(); l.splice(i,1); l.splice(j,0,a);
  appliqueOrdre(l);
}
function deplaceRubrique(id,vers){
  const r=rubDe(id); if(!r)return;
  const freres=enfants(r.parent||''), i=freres.findIndex(x=>x.id===id); if(i<0)return;
  const j=Math.max(0,Math.min(freres.length-1,vers)); if(j===i)return;
  const ordre=freres.slice(); ordre.splice(i,1); ordre.splice(j,0,r);
  /* on réécrit la liste : les sœurs prennent leur nouvel ordre à leurs
     anciennes places, tout le reste ne bouge pas */
  const places=S.rubs.map((x,k)=>freres.indexOf(x)>=0?k:-1).filter(k=>k>=0);
  const nv=S.rubs.slice(); places.forEach((k,n)=>{nv[k]=ordre[n];});
  S.rubs=nv; saveRubs(); rendLister();
}
/* mettre un article dans une rubrique (ou à la racine, cible vide) */
async function metDans(id,cible){
  const a=S.liste.find(x=>x.id===id); if(!a)return;
  cible=rubValide(cible)?cible:'';
  if((rubValide(a.rub)?a.rub:'')===cible)return;
  try{
    await acol().doc(id).set({rub:cible,ordre:null},{merge:true});
    a.rub=cible; a.ordre=null; if(S.res&&S.res.id===id){S.res.rub=cible;S.res.ordre=null;}
  }catch(e2){console.warn('rangement',e2);lvInfo('Le rangement n’a pas pu être enregistré.');}
  rendLister();
}
/* ranger une rubrique sous une autre (ou à la racine), avec les mêmes gardes
   que le menu : ni sous elle-même, ni trop profond */
function rubDans(id,cible){
  const r=rubDe(id); if(!r)return false;
  cible=rubValide(cible)?cible:'';
  if(cible===(r.parent&&rubValide(r.parent)?r.parent:''))return false;
  if(cible&&descendance(id).indexOf(cible)>=0)return false;
  if(cible&&niveau(cible)+hauteur(id)>RUB_MAX){lvInfo('Trop profond : le rangement ne descend pas au-delà de '+RUB_MAX+' niveaux.');return false;}
  const ouAvant=S.ouLa;
  r.parent=cible; saveRubs();
  if(ouAvant&&descendance(id).indexOf(ouAvant)>=0)vaVers(ouAvant); else rendLister();
  return true;
}
/* ── LE MODE ORGANISER ── */
function basculeOrganise(on){
  S.organise=(on===undefined)?!S.organise:!!on;
  if(S.organise&&S.choix)basculeChoisir(false);
  document.body.classList.toggle('organise',S.organise);
  /* en mode Organiser, le bouton devient une croix qui en sort
     (Emmanuel : « au lieu de Terminer, mets cette croix ») */
  const b=$('b-organiser'); if(b){
    if(S.organise){b.innerHTML='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';b.setAttribute('aria-label','Terminer');b.title='Terminer';}
    else{b.textContent='Organiser';b.removeAttribute('aria-label');b.removeAttribute('title');}
    b.classList.toggle('majeur',S.organise);b.classList.toggle('act-x',S.organise);}
  const m=$('mot-liste'); if(m&&S.auteur)m.textContent=''; /* pas de mode d'emploi à l'écran (choix d'Emmanuel) */
  rendLister();
}
/* ── LE GLISSER-DÉPOSER LUI-MÊME ──
   Événements de pointeur : une seule mécanique pour la souris, le doigt et
   le stylet. La poignée capture le pointeur, un double de l'objet suit le
   doigt, l'original pâlit, et à chaque mouvement on cherche sous le pointeur
   soit une rubrique ou un maillon du fil (poser DEDANS), soit le voisin le
   plus proche (poser AVANT ou APRÈS). Près des bords, la page défile
   d'elle-même. Échap annule. */
let DRAG=null;
function dragNettoie(){
  if(!DRAG)return;
  if(DRAG.ghost&&DRAG.ghost.parentNode)DRAG.ghost.parentNode.removeChild(DRAG.ghost);
  DRAG.el.classList.remove('fantome');
  document.querySelectorAll('.avant,.apres,.cible').forEach(x=>x.classList.remove('avant','apres','cible'));
  if(DRAG.defile)cancelAnimationFrame(DRAG.defile);
  DRAG=null;
}
function dragMarque(cible){
  document.querySelectorAll('.avant,.apres,.cible').forEach(x=>x.classList.remove('avant','apres','cible'));
  if(!cible)return;
  if(cible.type==='dans')cible.el.classList.add('cible');
  else cible.el.classList.add(cible.avant?'avant':'apres');
}
/* une rangée d'article ('c') ou de section ('r') : on ne réordonne
   qu'entre rangées de même espèce, les sections restant en tête */
function espece(e){return e&&e.classList?(e.classList.contains('art-ligne')?'c':(e.classList.contains('rub')?'r':'')):'';}
function dragCible(x,y){
  const sous=document.elementsFromPoint(x,y).filter(e=>!DRAG.ghost.contains(e));
  const fil=sous.map(e=>e.closest&&e.closest('.fil [data-va]')).find(Boolean);
  if(fil)return {type:'dans',el:fil,id:fil.getAttribute('data-va')||''};
  const ray=sous.map(e=>e.closest&&e.closest('.rub')).find(Boolean);
  if(ray&&ray!==DRAG.el){
    const rid=ray.dataset.va;
    /* un article entre dans la rubrique ; une rubrique y entre aussi, sauf
       si la cible est elle-même ou une de ses descendantes */
    if(DRAG.kind==='c'||(descendance(DRAG.id).indexOf(rid)<0)){
      /* une rubrique posée sur une rubrique SŒUR se réordonne ; « dedans »
         se fait en visant le tiers central */
      if(DRAG.kind==='r'&&ray.parentElement===DRAG.el.parentElement){
        const r=ray.getBoundingClientRect(), fx=(x-r.left)/r.width, fy=(y-r.top)/r.height;
        const unCol=ray.parentElement.getBoundingClientRect().width<ray.getBoundingClientRect().width*1.5;
        const centre=unCol?(fy>.35&&fy<.65):(fx>.35&&fx<.65);
        if(centre)return {type:'dans',el:ray,id:rid};
      }else return {type:'dans',el:ray,id:rid};
    }
  }
  /* sinon : le voisin le plus proche, dans le même contenant */
  const cont=DRAG.el.parentElement; if(!cont)return null;
  const freres=[...cont.children].filter(e=>e!==DRAG.el&&espece(e)===espece(DRAG.el));
  if(!freres.length)return null;
  let best=null,bd=1e12;
  freres.forEach(e=>{const r=e.getBoundingClientRect();const cx=Math.max(r.left,Math.min(r.right,x)),cy=Math.max(r.top,Math.min(r.bottom,y));const d=(cx-x)*(cx-x)+(cy-y)*(cy-y);if(d<bd){bd=d;best=e;}});
  const r=best.getBoundingClientRect();
  const unCol=cont.getBoundingClientRect().width<r.width*1.5;
  let avant;
  if(y<r.top)avant=true; else if(y>r.bottom)avant=false;
  else avant=unCol?(y<r.top+r.height/2):(x<r.left+r.width/2);
  return {type:'ordre',el:best,avant};
}
document.addEventListener('pointerdown',e=>{
  const h=e.target.closest?e.target.closest('.poignee'):null;
  if(!h||!S.organise||!S.auteur)return;
  const el=h.closest('.art-ligne,.rub'); if(!el)return;
  e.preventDefault();
  const kind=espece(el);
  const id=kind==='c'?el.dataset.rid2:el.dataset.va;
  const r=el.getBoundingClientRect();
  const ghost=el.cloneNode(true); ghost.classList.add('tire'); ghost.classList.remove('fantome');
  ghost.style.width=r.width+'px'; ghost.style.height=r.height+'px'; ghost.style.left=r.left+'px'; ghost.style.top=r.top+'px';
  document.body.appendChild(ghost);
  el.classList.add('fantome');
  DRAG={kind,id,el,ghost,dx:e.clientX-r.left,dy:e.clientY-r.top,cible:null,x:e.clientX,y:e.clientY,defile:0};
  try{h.setPointerCapture(e.pointerId);}catch(_){}
  const boucle=()=>{ if(!DRAG)return;
    const marge=70, v=window.innerHeight;
    if(DRAG.y<marge)window.scrollBy(0,-Math.ceil((marge-DRAG.y)/6));
    else if(DRAG.y>v-marge)window.scrollBy(0,Math.ceil((DRAG.y-(v-marge))/6));
    DRAG.defile=requestAnimationFrame(boucle); };
  DRAG.defile=requestAnimationFrame(boucle);
});
document.addEventListener('pointermove',e=>{
  if(!DRAG)return;
  DRAG.x=e.clientX; DRAG.y=e.clientY;
  DRAG.ghost.style.left=(e.clientX-DRAG.dx)+'px'; DRAG.ghost.style.top=(e.clientY-DRAG.dy)+'px';
  DRAG.cible=dragCible(e.clientX,e.clientY);
  dragMarque(DRAG.cible);
});
document.addEventListener('pointerup',e=>{
  if(!DRAG)return;
  const d=DRAG, c=d.cible; dragNettoie();
  if(!c)return;
  if(c.type==='dans'){
    if(d.kind==='c')metDans(d.id,c.id); else rubDans(d.id,c.id);
    return;
  }
  /* réordonner : la place du voisin visé, avant ou après lui */
  const cont=c.el.parentElement;
  const freres=[...cont.children].filter(x=>espece(x)===espece(d.el));
  const sans=freres.filter(x=>x!==d.el);
  let pos=sans.indexOf(c.el); if(!c.avant)pos++;
  if(d.kind==='c')deplaceRessource(d.id,pos); else deplaceRubrique(d.id,pos);
});
document.addEventListener('pointercancel',()=>dragNettoie());
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&DRAG)dragNettoie();});

// ════════ CHOISIR PLUSIEURS ════════
/* ── CHOISIR ──
   On coche ce qu'on veut, la barre du bas dit combien sont pris, et l'action
   (jeter, télécharger, déplacer) porte sur tout le lot. Le chevron › d'une
   rubrique reste la porte : on descend d'un étage sans perdre la sélection.
   Organiser et Choisir s'excluent : chacun demande le tap pour lui. */
function basculeChoisir(on){
  S.choix=(on===undefined)?!S.choix:!!on;
  if(S.choix&&S.organise)basculeOrganise(false);
  if(!S.choix)S.pris.clear();
  document.body.classList.toggle('choisir',S.choix);
  const b=$('b-choisir'); if(b){b.textContent=S.choix?'Terminer':'Choisir';b.classList.toggle('majeur',S.choix);}
  const m=$('mot-liste');
  if(m&&S.auteur)m.textContent=''; /* pas de mode d'emploi à l'écran (choix d'Emmanuel) */
  majChoix(); rendLister();
}
function majChoix(){
  const a=$('acts-liste'), c=$('acts-choix');
  if(a&&S.auteur&&pretListe())a.style.display=S.choix?'none':'';
  if(c)c.style.display=(S.choix&&S.auteur)?'':'none';
  const n=S.pris.size;
  ['b-jeter','b-telech','b-deplacer','b-qc'].forEach(k=>{const j=$(k); if(j){j.style.opacity=n?'1':'.4';j.disabled=!n;}});
}
/* ── TÉLÉCHARGER ET DÉPLACER PLUSIEURS ──
   Ce qui est coché se télécharge d'un coup (les articles cochés, et ceux
   rangés dans les rubriques cochées), ou se range d'un coup ailleurs. */
function prisDecoupe(){
  const pris=[...S.pris];
  const rids=pris.filter(k=>k.slice(0,2)==='r:').map(k=>k.slice(2)).filter(rubValide);
  const res=pris.filter(k=>k.slice(0,2)==='c:').map(k=>k.slice(2)).map(id=>S.liste.find(x=>x.id===id)).filter(Boolean);
  return {rids,res};
}
async function telechargeChoix(){
  if(!S.pris.size)return;
  const {rids,res}=prisDecoupe();
  const vus=new Set(res.map(a=>a.id)), lot=res.slice();
  rids.forEach(id=>descendance(id).forEach(d=>S.liste.filter(a=>a.rub===d&&!a.suppr).forEach(a=>{if(!vus.has(a.id)){vus.add(a.id);lot.push(a);}})));
  const ok=lot.filter(telechargeable), sans=lot.length-ok.length;
  if(!ok.length){lvInfo(lot.length?'Rien à télécharger.':'Ces catégories ne contiennent aucun article.');return;}
  if(ok.length>1&&!await lvConfirm('Télécharger '+ok.length+' fichiers ?'+(sans?' ('+sans+(sans>1?' liens ne se téléchargent pas)':' lien ne se télécharge pas)'):'')))return;
  /* l'un après l'autre, avec un court répit : les navigateurs refusent
     plusieurs téléchargements lancés au même instant */
  for(const a of ok){ await telechargeRessource(a); await new Promise(r=>setTimeout(r,450)); }
}
async function deplaceChoix(){
  if(!S.pris.size)return;
  const {rids,res}=prisDecoupe();
  if(!rids.length&&!res.length){basculeChoisir(false);return;}
  /* une rubrique ne descend ni en elle-même ni dans ses propres sections,
     ni plus bas que la profondeur permise */
  const interdits=[]; rids.forEach(id=>interdits.push(...descendance(id)));
  const hMax=rids.reduce((m,id)=>Math.max(m,hauteur(id)),0);
  const peut=cid=>!rids.length||niveau(cid)+hMax<=RUB_MAX;
  const e=[{cle:'r:',nom:rids.length?'À la racine':'Sans catégorie',fort:true}];
  e.push(...entreesArbre(interdits,peut,ici()));
  const n=rids.length+res.length;
  const c=await lvChoix('Déplacer '+(n>1?('les '+n+' éléments choisis'):'l’élément choisi')+' dans…',e);
  if(!c)return;
  const cible=c.slice(2);
  try{
    const lot=db.batch(); let k=0;
    res.forEach(a=>{ if((rubValide(a.rub)?a.rub:'')===cible)return; lot.set(acol().doc(a.id),{rub:cible,ordre:null},{merge:true}); a.rub=cible; a.ordre=null; k++; });
    if(k)await lot.commit();
    rids.forEach(id=>rubDans(id,cible));
  }catch(e2){console.warn('déplacement',e2);lvInfo('Le déplacement n’a pas pu être enregistré. Vérifiez la connexion, puis réessayez.');}
  basculeChoisir(false);
}
function prend(cle,el){
  if(S.pris.has(cle)){S.pris.delete(cle);if(el)el.classList.remove('pris');}
  else{S.pris.add(cle);if(el)el.classList.add('pris');}
  majChoix();
}
/* « Tout choisir » prend ce qui est À CET ENDROIT, rubriques et articles ;
   un second appui rend tout. */
function toutChoisir(){
  const ou=ici(), fils=enfants(ou), res=ressourcesDe(ou), tout=fils.length+res.length;
  const deja=tout>0&&fils.every(r=>S.pris.has('r:'+r.id))&&res.every(a=>S.pris.has('c:'+a.id));
  S.pris.clear();
  if(!deja){fils.forEach(r=>S.pris.add('r:'+r.id));res.forEach(a=>S.pris.add('c:'+a.id));}
  majChoix(); rendLister();
}
async function jetteChoix(){
  if(!S.pris.size)return;
  const pris=[...S.pris];
  const rids=pris.filter(k=>k.slice(0,2)==='r:').map(k=>k.slice(2)).filter(rubValide);
  const res=pris.filter(k=>k.slice(0,2)==='c:').map(k=>k.slice(2))
                .map(id=>S.liste.find(x=>x.id===id)).filter(Boolean);
  if(!rids.length&&!res.length){basculeChoisir(false);return;}
  let avec=true;
  const sous=rids.reduce((n,id)=>n+compteRub(id),0);
  if(sous){
    const q=await lvChoix(sous>1?('Et les '+sous+' articles rangés dedans ?'):'Et l’article rangé dedans ?',[
      {cle:'avec',nom:'Les mettre aussi à la corbeille',fort:true},
      {cle:'sans',nom:'Les laisser, sans catégorie'}
    ]);
    if(!q)return;
    avec=(q==='avec');
  }
  const bouts=[];
  if(res.length)bouts.push(res.length+(res.length>1?' articles':' article'));
  /* une seule rubrique se nomme par ce qu'elle est, plusieurs se comptent */
  if(rids.length)bouts.push(rids.length>1?(rids.length+' catégories ou sections'):('cette '+motRub(rids[0])));
  if(!await lvConfirm('Mettre à la corbeille '+bouts.join(' et ')+' ?'))return;
  /* du plus haut vers le plus profond : une rubrique emporte ses sections,
     et celles qui étaient cochées avec elle sont déjà parties quand leur
     tour vient */
  const ordre=rids.slice().sort((x,y)=>niveau(x)-niveau(y));
  try{
    for(const a of res)await jetteRessource(a,'');
    for(const id of ordre)if(rubValide(id))await jetteRubrique(id,avec);
  }catch(e){
    console.warn('corbeille',e);
    lvInfo('Une partie n’a pas pu être mise à la corbeille. Vérifiez la connexion, puis réessayez.');
  }

// ════════ LA CORBEILLE ════════
/* ── LA CORBEILLE ──
   Un article jeté garde sa place dans le compte et reçoit une date de mise
   au rebut : il sort de la liste, entre à la corbeille, et son contenu reste
   attaché. Une rubrique jetée passe de la liste des rubriques à la liste
   « corbeille » du même document, avec toute sa branche, chaque rubrique
   notant la RACINE avec laquelle elle est tombée : « Remettre » relève
   l'arbre entier d'un seul geste, avec les articles descendus avec lui.
   Le départ définitif se demande, ligne par ligne ou par « Vider la
   corbeille » ; au bout de trente jours, il se fait de lui-même
   (commun/rubriques.js). */
const maintenant=()=>new Date().toISOString();
const racinesJetees=()=>S.corb.filter(x=>(x.racine||x.id)===x.id);
/* un article jeté seul, ou dont la rubrique a depuis quitté la corbeille,
   se présente pour lui-même */
const jeteesSeules=()=>S.jetees.filter(a=>!a.supprRub||!S.corb.some(x=>x.id===a.supprRub));
const nCorbeille=()=>racinesJetees().length+jeteesSeules().length;
function majCorbBouton(){
  const b=$('b-corbeille'); if(!b)return;
  const n=nCorbeille();
  /* une poubelle et, s'il y a quelque chose dedans, le nombre */
  b.innerHTML='<svg class="ic-poubelle" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4.5 7h15M9.5 7V5.2c0-.4.3-.7.7-.7h3.6c.4 0 .7.3.7.7V7M6.5 7l.9 11.6c.1.8.7 1.4 1.5 1.4h6.2c.8 0 1.4-.6 1.5-1.4L17.5 7M10.2 10.5v6M13.8 10.5v6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'+(n?'<span class="corb-n">'+n+'</span>':'');
  b.setAttribute('aria-label',n?('Corbeille, '+n+(n>1?' éléments':' élément')):'Corbeille');
  b.title='Corbeille';
}
async function jetteRessource(a,racine){
  if(!a)return;
  const q={suppr:maintenant(),supprRub:racine||''};
  await acol().doc(a.id).set(q,{merge:true});
  Object.assign(a,q);
}
async function remetRessource(a){
  if(!a)return;
  await acol().doc(a.id).set({suppr:'',supprRub:''},{merge:true});
  a.suppr=''; a.supprRub='';
}
async function detruitRessource(a){
  if(!a)return;
  SUPPRIMES.add(a.id);
  await acol().doc(a.id).delete();
  try{ await effaceCode(ccol(),a.id); }catch(e){console.warn('contenu',e);}
  CODES.delete(a.id);
  if(a.media)await effaceMedia(a.media);
}
async function jetteRubrique(id,avec){
  const r=rubDe(id); if(!r)return;
  const morts=descendance(id), ouAvant=S.ouLa, quand=maintenant();
  const dedans=S.liste.filter(a=>morts.indexOf(a.rub)>=0);
  morts.forEach(mid=>{const x=rubDe(mid);if(x)S.corb.push({id:x.id,nom:x.nom,parent:x.parent||'',suppr:quand,racine:id});});
  S.rubs=S.rubs.filter(x=>morts.indexOf(x.id)<0);
  saveRubs();
  for(const a of dedans){
    if(avec)await jetteRessource(a,id);
    else{
      /* laissés en place, ils ressortent sans catégorie */
      a.rub=''; await acol().doc(a.id).set({rub:''},{merge:true});
      }
  }
  /* si l'on se tenait dedans, on remonte d'un cran plutôt que de rester sur
     une page qui n'existe plus */
  if(morts.indexOf(ouAvant)>=0)vaVers(r.parent||'');
  else rendLister();
}
async function remetRubrique(id){
  const bande=S.corb.filter(x=>(x.racine||x.id)===id);
  if(!bande.length)return;
  /* une rubrique dont le parent a disparu remonte au premier niveau : la règle
     du rangement s'en charge d'elle-même */
  bande.forEach(x=>S.rubs.push({id:x.id,nom:x.nom,parent:x.parent||''}));
  S.corb=S.corb.filter(x=>(x.racine||x.id)!==id);
  saveRubs();
  try{for(const a of S.jetees.filter(a=>a.supprRub===id))await remetRessource(a);}
  catch(e2){console.warn('restauration',e2);lvInfo('Une partie des articles de cette catégorie n’a pas pu être restaurée. Vérifiez la connexion et réessayez depuis la corbeille.');}
  rendCorbeille(); majCorbBouton();
}
async function detruitRubrique(id){
  for(const a of S.jetees.filter(a=>a.supprRub===id))await detruitRessource(a);
  S.corb=S.corb.filter(x=>(x.racine||x.id)!==id);
  saveRubs(); rendCorbeille(); majCorbBouton();
}
function ligneJetee(nom,note,cleR,cleX){
  const d=document.createElement('div'); d.className='jete';
  d.innerHTML='<span class="jt-nom">'+esc(nom)+'</span>'
    +'<span class="jt-note">'+esc(note)+'</span>'
    +'<span class="jt-act" '+cleR+' role="button" tabindex="0">Remettre</span>'
    +'<span class="jt-act danger" '+cleX+' role="button" tabindex="0">Supprimer</span>';
  return d;
}
function rendCorbeille(){
  const h=$('corb-liste'); if(!h)return;
  majCorbBouton();
  const racines=racinesJetees(), seules=jeteesSeules(), n=racines.length+seules.length;
  $('compte-corb').textContent=n?(n+(n>1?' éléments':' élément')):'';
  const bv=$('b-corb-vider'); if(bv)bv.style.display=n?'':'none';
  h.innerHTML='';
  if(!n){h.innerHTML='<div class="vide lv-vide">La corbeille est vide.</div>';return;}
  racines.forEach(x=>{
    const dedans=S.jetees.filter(a=>a.supprRub===x.id).length;
    const note=(x.parent?'Section':'Catégorie')
      +(dedans?' · '+dedans+(dedans>1?' articles':' article'):'')
      +' · '+dateFr(x.suppr);
    h.appendChild(ligneJetee(x.nom||'Sans nom',note,'data-corb-r="'+esc(x.id)+'"','data-corb-rx="'+esc(x.id)+'"'));
  });
  seules.forEach(a=>{
    h.appendChild(ligneJetee(a.titre||'Sans titre',dateFr(a.suppr),'data-corb-a="'+esc(a.id)+'"','data-corb-ax="'+esc(a.id)+'"'));
  });
}
async function videCorbeille(){
  if(!nCorbeille())return;
  if(!await lvConfirm('Vider la corbeille ? Tout ce qu’elle contient part pour de bon.',1))return;
  try{
    for(const a of S.jetees.slice())await detruitRessource(a);
    S.corb=[]; saveRubs();
  }catch(e){
    console.warn('corbeille',e);
    lvInfo('La corbeille n’a pas pu être entièrement vidée. Vérifiez la connexion, puis réessayez.');
  }
  rendCorbeille(); majCorbBouton();
}

// ════════ SITE PRIVÉ ════════
/* Le site est privé (Emmanuel : « je ne compte plus le rendre public ») :
   rien ne se publie, et il n'y a pas de visiteur. Les anciennes copies
   publiques sont effacées une fois pour toutes par le ménage commun
   (commun/menage.js), lancé à la connexion. */

/* ── LE CONTENU À PART, LA LISTE LÉGÈRE ──
   Le code d'un article pèse de quelques dizaines à plusieurs centaines de
   kilo-octets. Il vit à part (fiche art_code et coffre R2), lu seulement
   quand on ouvre, modifie ou télécharge l'article : la liste n'a pas à charger
   tous les contenus. La fiche de l'article garde la taille du contenu,
   l'extrait et la marque devinée, dont la liste a besoin.
   Une fiche qui porte encore son contenu le dépose d'elle-même à sa place
   la première fois que la liste la voit : le contenu est d'abord écrit dans
   le coffre, puis seulement retiré de la fiche. */
const ccol=()=>db.collection('users/'+S.uid+'/art_code');
const CODES=new Map();

/* ── LES CONTENUS DANS LE COFFRE ──
   La page de l'article vit dans le coffre R2, sa fiche (art_code) dit
   où : voir commun/stockage.js. Une fiche plus ancienne, qui porte encore
   son contenu ou ses tranches, se lit toujours ; le déménagement la fait
   passer dans le coffre. */
const CODE_MAX=LV_R2_CODE_MAX;      // une page HTML : trois cents mégaoctets au plus
const CODE_SEUL=900000;             // sous ce poids, un contenu plus ancien tenait dans sa fiche
const octets=t=>new Blob([t]).size;
const litCode=(col,id)=>lvContenuLit(col,id);
const ecritCode=(col,id,code,avecFiche)=>lvContenuEcrit(col,id,code,avecFiche);
const effaceCode=(col,id)=>lvContenuEfface(col,id);
async function contenuDe(a){
  if(!a||typeDe(a)!=='diagramme')return '';
  if(typeof a.code==='string'&&a.code)return a.code;
  if(CODES.has(a.id)){a.code=CODES.get(a.id);return a.code;}
  /* une lecture ratée LÈVE : un contenu pris pour vide serait ensuite
     enregistré vide par-dessus le vrai */
  const lu=await litCode(ccol(),a.id);
  const code=lu!==null?lu:(typeof a.code==='string'?a.code:'');
  CODES.set(a.id,code); a.code=code;
  /* un article dont la marque devinée manque ou a changé la reçoit dès
     qu'on l'ouvre */
  if(S.auteur&&S.uid&&code){
    const m=devineMarque(a);
    if(m&&m!==(a.marqueDevinee||'')){ a.marqueDevinee=m; acol().doc(a.id).update({marqueDevinee:m}).catch(()=>{}); }
  }
  return code;
}
const MIGRES=new Set();
async function migreContenus(liste){
  for(const a of liste){
    if(typeof a.code!=='string'||MIGRES.has(a.id)||SUPPRIMES.has(a.id))continue;
    MIGRES.add(a.id);
    try{
      const FV=firebase.firestore.FieldValue;
      const code=a.code;
      if(code){
        await lvContenuEcrit(ccol(),a.id,code);
        CODES.set(a.id,code);
      }
      await acol().doc(a.id).update({code:FV.delete(),codeTaille:new Blob([code]).size,marqueDevinee:devineMarque(a)});
    }catch(e){ console.warn('déplacement du contenu',a.id,e); MIGRES.delete(a.id); }
  }
}

function corpsVoir(a){
  const t=typeDe(a), c=document.createElement('div');
  if(t==='lien'){
    let u=String(a.url||'').trim();
    /* seuls http(s) et mailto sont suivis : pas de « javascript: » */
    if(u&&!/^(https?:|mailto:)/i.test(u))u='';
    c.innerHTML=(a.desc?'<div class="res-desc">'+esc(a.desc)+'</div>':'')
      +(u?'<a class="res-lien" target="_blank" rel="noopener noreferrer" href="'+esc(u)+'">Ouvrir le lien →</a>'
         +'<div class="res-url">'+esc(u)+'</div>':'<div class="res-desc">Aucune adresse.</div>');
    return c;
  }
  if(t==='diagramme'){
    if(typeof a.code!=='string'||a.code||a.codeTaille){
      /* Le contenu s'ouvre en plein écran dès qu'il est là ; en
         attendant, le cercle seul. Un échec laisse « Réessayer ». */
      c.innerHTML='<div class="lv-attente"><span class="lv-roue" role="status" aria-label="Chargement"></span></div>';
      ouvrePleinCharge(a,true,c);
      return c;
    }
    c.innerHTML='<div class="res-desc">Cet article est vide.</div>';
    if(a.desc){const d=document.createElement('div');d.className='res-desc';d.textContent=a.desc;c.appendChild(d);}
    return c;
  }
  const cadre=document.createElement('div'); cadre.className='res-cadre';
  cadre.innerHTML='<div class="lv-attente"><span class="lv-roue" role="status" aria-label="Chargement"></span></div>';
  c.appendChild(cadre);
  if(a.desc){const d=document.createElement('div');d.className='res-desc';d.textContent=a.desc;c.appendChild(d);}
  if(a.media){
    chargeMedia(a.media).then(u=>{
      cadre.innerHTML='';
      if(t==='image'){
        const im=document.createElement('img'); im.alt=a.titre||''; im.src=u;
        im.title='Cliquer pour agrandir';
        cadre.classList.add('img');
        /* l'agrandissement se fait sur place : on reste dans la page, et le
           bouton « précédent » n'a rien de nouveau à défaire */
        im.addEventListener('click',()=>{
          const z=cadre.classList.toggle('zoom');
          im.title=z?'Cliquer pour réduire':'Cliquer pour agrandir';
          if(!z)cadre.scrollIntoView({block:'nearest'});
        });
        cadre.appendChild(im);
      }else{
        const f=document.createElement('iframe');
        f.setAttribute('title',a.titre||'Document');
        f.style.height='min(80vh,900px)';
        f.src=blobDe(u);
        cadre.appendChild(f);
      }
    }).catch(()=>{cadre.innerHTML='<div class="res-desc" style="padding:26px;margin:0">Ce fichier est introuvable.</div>';});
  }else cadre.innerHTML='<div class="res-desc" style="padding:26px;margin:0">Aucun fichier.</div>';
  return c;
}
/* ── PLEIN ÉCRAN ──
   Le cadre prend l'écran entier, au-dessus de tout. Le contenu défile chez lui
   et retrouve donc ses propres éléments collants : barre, sommaire, retour en
   haut. Un seul plein écran à la fois. */
let PLEIN=null;
function ouvrePlein(a){
  if(!a||!a.code)return;
  fermePlein();
  const f=document.createElement('iframe');
  f.className='res-plein';
  f.setAttribute('sandbox','allow-scripts');
  f.setAttribute('allow','clipboard-write *');
  f.setAttribute('referrerpolicy','no-referrer');
  f.setAttribute('title',a.titre||'Article');
  f.dataset.diag='1'; f.dataset.res=a.id||'';
  /* on rouvre là où l'on s'était arrêté : la place et l'état sont gardés par
     article, sur l'appareil et dans le compte ; la plus récente l'emporte */
  f._pret=rapatrie(a.id||'');
  /* On lui rend son état avant sa place : les sections reprennent leur
     ouverture, puis la place de lecture tombe sur la page ainsi constituée. */
  const rends=()=>f._pret.then(()=>{
    if(PLEIN&&PLEIN.f!==f)return;
    envoieEtat(f);
    const pi=litPos(a.id||'');
    try{f.contentWindow.postMessage({lvRevoir:Math.max(0,Math.round(pi.y||0)),lvRevoirInfo:pi},'*');}catch(_){}
    f._rendu=true;
  });
  /* Le contenu se déclare prêt (lvEtatVoulu) : c'est seulement alors que
     son état lui est rendu et que ce qu'il envoie est gardé. Le chargement
     du cadre ne suffit pas : certains navigateurs (Safari sur iPhone) en
     annoncent un premier, à blanc, avant le contenu, et l'état de départ du
     contenu (ouverture du cours, sections fermées) écraserait la reprise.
     Un contenu qui ne se déclare pas (une page sans moteur) suit le
     chargement. */
  f._annonce=typeof a.code==='string'&&a.code.indexOf('lvEtatVoulu')>=0;
  f._rends=()=>{rends();setTimeout(rends,300);setTimeout(rends,1000);};
  f.addEventListener('load',()=>{if(!f._annonce)f._rends();});
  const x=document.createElement('button');
  /* Un bouton de retour par-dessus le contenu (Emmanuel : « pas besoin de
     bouton fermer, juste un bouton de retour »). La touche Échap fait la
     même chose. Une flèche seule, sans texte (« juste une
     icône de retour en arrière »), comme partout ailleurs dans la page. */
  x.type='button'; x.className='res-plein-x'; x.innerHTML='<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 12h-15M10.5 6l-6 6 6 6"/></svg>';
  x.setAttribute('aria-label','Revenir aux articles');
  x.onclick=retourRessources;
  /* Dans le même bandeau que le retour, séparé par un mince trait, le livre
     qui ouvre la Bible par-dessus l'article. */
  const bi=document.createElement('button');
  bi.type='button'; bi.className='res-plein-x res-plein-bible';
  bi.innerHTML='<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6.5C10.3 5.2 7.8 4.6 4 4.6v13.2c3.8 0 6.3.6 8 1.9 1.7-1.3 4.2-1.9 8-1.9V4.6c-3.8 0-6.3.6-8 1.9z"/><path d="M12 6.5v13.2"/></svg>';
  bi.setAttribute('aria-label','Ouvrir la Bible');
  bi.onclick=()=>{ if(window.LVBible&&typeof window.LVBible.bascule==='function')window.LVBible.bascule(); };
  const g=document.createElement('div'); g.className='res-plein-acts';
  /* au bout du bandeau, une question à l'IA sur toute la page, sans rien
     sélectionner (Emmanuel : « résume-moi la leçon 3 ») */
  const ia=document.createElement('button');
  ia.type='button'; ia.className='res-plein-x res-plein-bible res-plein-ia';
  ia.innerHTML='<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M10 3.5l1.6 4.4 4.4 1.6-4.4 1.6L10 15.5l-1.6-4.4L4 9.5l4.4-1.6zM18 13.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></svg>';
  ia.setAttribute('aria-label','Poser une question à l’IA sur cette page'); ia.title='Question à l’IA';
  ia.onclick=()=>{ if(typeof qaReprend==='function')qaReprend({texte:'',contexte:'',source:a.titre||'',espece:'un article',ref:{col:'art_code',id:a.id}},typeof a.code==='string'?a.code:''); };
  g.appendChild(x); g.appendChild(bi); g.appendChild(ia);
  /* le document du cadre est écrit avant que le cadre entre dans la page :
     un cadre posé vide se charge d'abord à blanc, et ce premier chargement
     passerait pour le sien ; l'état gardé serait tenu pour rendu trop tôt,
     et l'état de naissance du contenu (première page, sections fermées)
     l'écraserait */
  poseCadre(f,a.code);
  document.body.appendChild(f); document.body.appendChild(g);
  document.body.classList.add('plein');
  PLEIN={f:f,x:g};
}

function rendEditeur(){
  /* ── UN ARTICLE EST UNE PAGE HTML, faite avec la skill article-html ──
     Ni espèce ni marque à choisir : on dépose le fichier de l'article, ou on
     colle sa page. Il s'ouvre en plein écran, comme une ressource. */
  const a=S.res;
  a.type='diagramme';
  $('ed-titre').value=a.titre||'';
  setTimeout(()=>autoHauteur($('ed-titre')),0);
  const h='<span class="champ-lab">L’article</span>'
    +'<div class="depose" id="dep-code"><span class="dep-mot">Glisse ici le fichier HTML de l’article, ou</span>'
    +'<button type="button" class="act" id="b-code-fichier">Choisir un fichier</button>'
    +'<span class="poids" id="dep-code-etat"></span></div>'
    +'<textarea class="res-zone code" id="f-code" rows="14" spellcheck="false" placeholder="&lt;!DOCTYPE html&gt;…">'+esc(a.code||'')+'</textarea>'
    +'<div class="aide">Le fichier déposé remplit la zone ; tu peux aussi y coller la page HTML. Elle tournera dans un cadre isolé, sans aucun accès au site ni aux comptes.</div>';
  $('res-form').innerHTML=h;
  const co=$('f-code');
  if(co)co.addEventListener('input',()=>{S.res.code=co.value;marqueSale();majRenommer();});
  const brn=$('b-renommer'); if(brn){brn.onclick=renommeIA;majRenommer();}
  const bcf=$('b-code-fichier');
  if(bcf)bcf.onclick=()=>{const i=$('f-code-fichier');i.value='';i.click();};
  /* le dépôt à la souris : sur le cadre de dépôt comme sur la zone du code */
  [$('dep-code'),$('f-code')].forEach(z=>{
    if(!z)return;
    let n=0;
    const cadre=$('dep-code');
    z.addEventListener('dragenter',e=>{e.preventDefault();n++;cadre.classList.add('survol');});
    z.addEventListener('dragover',e=>{e.preventDefault();if(e.dataTransfer)e.dataTransfer.dropEffect='copy';});
    z.addEventListener('dragleave',()=>{n=Math.max(0,n-1);if(!n)cadre.classList.remove('survol');});
    z.addEventListener('drop',e=>{
      e.preventDefault();e.stopPropagation();n=0;cadre.classList.remove('survol');
      const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
      if(f)chargeCode(f);
    });
  });
}
function litEditeur(){
  if(!S.res)return;
  S.res.titre=$('ed-titre').value.trim();
  const co=$('f-code');
  if(co)S.res.code=co.value;
}
/* Un article supprimé ne renaît pas : un enregistrement automatique parti
   juste avant la suppression le recréerait. */
const SUPPRIMES=new Set();
const LIMITE_DOC=1000000;   // Firestore refuse un document au-delà d'un mégaoctet
/* ── UN ENREGISTREMENT À LA FOIS ──
   Les enregistrements passent l'un après l'autre. Un article neuf n'est
   tenu pour « déjà dans le nuage » qu'une fois son premier envoi abouti :
   sinon un gros envoi encore en route le ferait croire supprimé ailleurs. */
let ENR_EN_COURS=null, ENR_REJOUE=false;
function enregistre(silence){
  if(ENR_EN_COURS){
    ENR_REJOUE=true; clearTimeout(S.minute);
    return ENR_EN_COURS;
  }
  ENR_EN_COURS=(async()=>{
    try{ await enregistreUneFois(silence); }
    finally{
      ENR_EN_COURS=null;
      if(ENR_REJOUE){ ENR_REJOUE=false; if(S.res&&S.sale)await enregistre(true); }
    }
  })();
  return ENR_EN_COURS;
}
async function enregistreUneFois(silence){
  if(!S.res)return;
  clearTimeout(S.minute);
  litEditeur();
  const a=S.res, gen=S.gen||0;
  /* un article neuf n'existe dans le nuage qu'après son premier envoi réussi */
  const deja=!a.neuve;
  a.maj=new Date().toISOString();
  if(!a.cree)a.cree=a.maj;
  const doc={
    titre:a.titre||'', type:typeDe(a), desc:a.desc||'', rub:a.rub||'',
    media:a.media||'', mime:a.mime||'', taille:a.taille||0, nom:a.nom||'',
    vign:a.vign||'', url:a.url||'', cree:a.cree, maj:a.maj,
    marque:a.marque||''
  };
  /* le contenu part dans sa propre fiche ; la fiche garde sa taille et la
     marque devinée, dont la liste a besoin */
  const avecCode=typeDe(a)==='diagramme'&&typeof a.code==='string';
  if(avecCode){ a.extrait=extraitDuCode(a.code); }
  doc.extrait=a.extrait||'';
  if(avecCode){ doc.codeTaille=new Blob([a.code]).size; doc.marqueDevinee=devineMarque(a); a.codeTaille=doc.codeTaille; a.marqueDevinee=doc.marqueDevinee; }
  else{ doc.codeTaille=a.codeTaille||0; doc.marqueDevinee=a.marqueDevinee||''; }
  /* la limite de Firestore se compte en octets : un accent en pèse deux */
  if(new Blob([JSON.stringify(doc)]).size>LIMITE_DOC||(avecCode&&octets(a.code)>CODE_MAX)){
    $('etat-enr').textContent='Non enregistré';
    lvInfo('Cet article d\u00e9passe la taille maximale (300 Mo). All\u00e9gez-le.');
    return;
  }
  try{
    /* ── UN AUTRE ONGLET, UN AUTRE APPAREIL ──
       On relit le nuage avant d'écrire : un article supprimé ailleurs
       pendant qu'il restait ouvert ici ne renaît pas. */
    const ex=await acol().doc(a.id).get();
    if(S.res!==a)return;
    if(deja&&!ex.exists){
      S.sale=false; $('etat-enr').textContent='Supprimé ailleurs'; $('etat-enr').classList.remove('vu');
      lvInfo('Cet article a été supprimé depuis un autre onglet ou un autre appareil : cette version n\u2019a pas été enregistrée. Copiez votre texte si vous voulez le garder.');
      return;
    }
    /* contenu et fiche partent ensemble, ou pas du tout */
    if(avecCode&&CODES.get(a.id)!==a.code)await ecritCode(ccol(),a.id,a.code,lot=>lot.set(acol().doc(a.id),doc));
    else await acol().doc(a.id).set(doc);
    if(avecCode)CODES.set(a.id,a.code);
    delete a.neuve;
    /* quittée ou supprimée pendant l'envoi : on n'y touche plus */
    if(S.res!==a||SUPPRIMES.has(a.id))return;
    /* une frappe survenue pendant l'envoi reste « modifiée » et partira au
       prochain passage */
    if(gen===(S.gen||0))S.sale=false;
    $('etat-enr').textContent=S.sale?'Modifié':'Enregistré'; $('etat-enr').classList.toggle('vu',!S.sale);
    if(!silence)setTimeout(()=>{if(!S.sale)$('etat-enr').textContent='';},2600);
  }catch(e){
    if(S.res!==a)return;
    $('etat-enr').textContent='Non enregistré';
    console.warn('enregistrement',e);
  }
}
async function ouvre(id){
  const a=S.liste.find(x=>x.id===id); if(!a)return;
  let code='';
  try{ code=await contenuDe(a); }
  catch(e){ console.warn('contenu',e); lvInfo('Le contenu de cet article n’a pas pu être chargé. Vérifiez la connexion, puis réessayez.'); return; }
  S.res=JSON.parse(JSON.stringify(a)); S.sale=false;
  if(typeDe(a)==='diagramme')S.res.code=code;
  $('etat-enr').textContent='';
  rendEditeur(); vue('edit');
}
function nouveau(){
  /* l'article naît là où l'on se trouve : il se range dans la rubrique
     ouverte, sans avoir à le redire */
  S.res={id:'s'+Date.now(),titre:'',type:'diagramme',desc:'',rub:ici(),
         media:'',mime:'',taille:0,nom:'',vign:'',code:'',url:'',cree:null,maj:null,neuve:true};
  S.sale=false; $('etat-enr').textContent='';
  rendEditeur(); vue('edit');
  setTimeout(()=>$('ed-titre').focus(),80);
}
async function supprime(){
  if(!S.res)return;
  if(!await lvConfirm('Mettre cet article à la corbeille ? Vous pourrez l’en rétablir.'))return;
  clearTimeout(S.minute);
  const copie=S.res;
  S.res=null; S.sale=false;
  vue('liste');
  /* l'article ouvert dans l'éditeur tombe comme un autre : il garde son
     contenu et attend à la corbeille. Un échec se dit, et il reste à la
     liste tel qu'il était. */
  try{
    await jetteRessource(copie,'');
    rendLister(); majCorbBouton();
  }catch(e){
    console.warn('corbeille',e); rendLister();
    lvInfo('La mise à la corbeille n’a pas abouti. Vérifiez la connexion, puis réessayez.');
  }
}

let COUPE=null;
function ecoute(){
  if(COUPE){try{COUPE();}catch(e){}COUPE=null;}
  if(!S.uid)return;
  RUBS_LUES=false; LISTE_LUE=false;
  rdoc().get()
    .then(d=>{S.rubs=(d.exists&&d.data().list)||[];S.corb=(d.exists&&d.data().corbeille)||[];RUBS_LUES=true;lvPlanPurge();if(LISTE_LUE)lvCoffreDemarre('articles');
      /* un article déjà ouvert à l'écran reste ouvert : relire le rangement
         ne le referme pas */
      if(!S.res&&$('ecran-voir').style.display==='none')routeHash();})
    .catch(e=>{console.warn('rubriques',e);RUBS_ERR=true;lvInfo('Le rangement n’a pas pu être lu. Rechargez la page avant d’y toucher.');if(!S.res&&!S.vu)rendLister();});
  COUPE=acol().onSnapshot(sn=>{
    const l=sn.docs.map(d=>Object.assign({id:d.id},d.data()));
    l.sort((a,b)=>String(b.maj||b.cree||'').localeCompare(String(a.maj||a.cree||'')));
    /* Ce qui est à la corbeille porte une date de mise au rebut : la liste
       courante ne montre que ce qui vit, la corbeille montre le reste. */
    S.jetees=l.filter(a=>!!a.suppr).sort((a,b)=>String(b.suppr).localeCompare(String(a.suppr)));
    S.liste=l.filter(a=>!a.suppr); LISTE_LUE=true; lvPlanPurge();
    /* le coffre R2 : arrivées, index, déménagement (commun/coffre.js) */
    if(RUBS_LUES){lvCoffreDemarre('articles');lvIndexPlus('articles');}
    /* les fiches qui portent encore leur contenu le déposent à sa place, en
       arrière-plan */
    /* seules comptent les fiches qui portent leur contenu au moment de la
       lecture : l'ouverture d'un élément pose ensuite son contenu sur la
       fiche en mémoire, et le recopier dans Firestore écraserait le
       pointeur vers le coffre R2 */
    const aDeposer=l.filter(a=>typeof a.code==='string').map(a=>Object.assign({},a));
    if(aDeposer.length)setTimeout(()=>migreContenus(aDeposer),1500);
    if($('ecran-corbeille').style.display!=='none')rendCorbeille();
    /* on ne rebâtit la liste que si elle est à l'écran : un rafraîchissement
       des données ne chasse pas l'article ouvert */
    if(!S.res&&!S.vu)rendLister();
    /* arrivé avec une adresse #r/… : l'article n'était pas encore là quand
       la page a lu l'adresse, il l'est maintenant, on l'ouvre */
    else if(!S.res&&S.vu&&$('ecran-voir').style.display==='none')routeHash();
  },e=>{console.warn('ressources',e);LISTE_ERR=true;LISTE_LUE=true;if(!S.res&&!S.vu)rendLister();});
}

/* Firebase redit qui est connecté à chaque réveil de la page (retour d'onglet,
   jeton rafraîchi). Ce n'est pas un changement de compte : si c'est le même
   utilisateur, on ne touche à rien : l'article ouvert reste ouvert quand
   on revient sur l'onglet. */
let COMPTE_CONNU='∅';
auth.onAuthStateChanged(u=>{
  const cle=u?u.uid:null;
  AUTH_VU=true;
  if(cle===COMPTE_CONNU)return;
  COMPTE_CONNU=cle;
  S.uid=cle;
  S.auteur=!!(u&&u.email&&u.email.toLowerCase()===AUTEUR);
  /* les règles de sécurité n'acceptent que l'adresse VÉRIFIÉE du compte :
     si elle ne l'est pas, on le dit tout de suite plutôt que de laisser
     chaque écriture échouer sans explication */
  if(S.auteur&&u&&u.emailVerified===false)setTimeout(()=>lvInfo('Votre adresse e-mail n’est pas vérifiée : la base refusera tout enregistrement tant qu’elle ne l’est pas. Connectez-vous avec Google, ou faites vérifier l’adresse depuis la console Firebase.'),600);
  S.res=null; S.vu=''; S.liste=[]; S.jetees=[]; S.rubs=[]; S.corb=[]; S.pris.clear(); PURGE_FAITE=false; RUBS_LUES=false; RUBS_ERR=false; LISTE_ERR=false;
  if(S.auteur){ vue('liste'); motAccueil(); ecoute(); setTimeout(()=>{menagePublic().catch(e=>console.warn('ménage',e));},4000); }
  else{ if(COUPE){COUPE();COUPE=null;} $('acts-liste').style.display='none'; ouvrePublic(); }
});
/* ── ON DESSINE TOUT DE SUITE ──
   La page montre le cercle de chargement dès la première image, sans attendre la
   réponse du serveur : sur une connexion lente, une page nue ferait croire
   à un échec. */

/* L'adresse porte l'endroit : #d/… pour une rubrique, #r/… pour un article
   ouvert, #corbeille. Le bouton « précédent » du navigateur remonte donc
   tout seul. */
function routeHash(){
  const h=location.hash||'';
  const mr=h.match(/^#r\/(.+)$/);
  if(mr){
    const a=S.auteur?S.liste.find(x=>x.id===mr[1]):null;
    if(a){voit(a);return;}
    /* la liste n'est pas encore arrivée : on garde l'adresse en mémoire et on
       ouvrira dès que les données seront là, plutôt que de retomber à la
       racine */
    if(S.auteur&&!S.liste.length){S.vu=mr[1];return;}
  }
  /* la corbeille a son adresse : le bouton « précédent » du navigateur en
     ressort comme d'une rubrique */
  if(h==='#corbeille'&&S.auteur){S.vu='';vue('corbeille');return;}
  const md=h.match(/^#d\/(.+)$/);
  S.ouLa=(md&&rubValide(md[1]))?md[1]:'';
  S.vu='';
  vue('liste');
}

   faisait deux rendus par retour arrière */
window.addEventListener('popstate',routeHash);

/* Le panneau « Mon compte » : MÊME câblage que sur la Bible et Mémoriser.
   La barre du site est posée par le build : on attend que ses icônes
   soient là plutôt que de les chercher trop tôt. */
document.addEventListener('DOMContentLoaded',()=>{
  const ao=$('auth-ouvrir');
  if(ao)ao.onclick=e=>{
    e.stopPropagation();
    /* le formulaire de connexion vit sur l'accueil : cette page n'en porte
       pas, on y renvoie plutôt que de ne rien faire */
    if(!auth.currentUser){location.href='/#connexion';return;}
    $('macct-mail').textContent=auth.currentUser.email||'';
    $('auth-overlay').classList.add('ouvert');
  };
  const ax=$('macct-x'); if(ax)ax.onclick=()=>$('auth-overlay').classList.remove('ouvert');
  const ov=$('auth-overlay');
  if(ov)ov.addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('ouvert');});
  const al=$('auth-logout'); if(al)al.onclick=()=>{auth.signOut();$('auth-overlay').classList.remove('ouvert');};
  const ro=$('rech-ouvrir'); if(ro)ro.onclick=()=>lvInfo('La recherche des articles arrive bientôt.');
});

</script>
<script>
/* Réglage de la taille du texte et bascule de l'onglet Bible : MÊME CODE que
   sur l'accueil, la Bible et Mémoriser. La clé de rangement est distincte
   entre téléphone et ordinateur, pour qu'un choix fait sur l'un ne s'impose
   pas à l'autre. */
(function(){
  var TZ=[0.85,0.925,1,1.08,1.16,1.25];
  function tzCle(){try{return (window.matchMedia&&(matchMedia('(pointer:coarse)').matches||matchMedia('(max-width:720px)').matches))?'lv_taille_mobile':'lv_taille_pc';}catch(e){return 'lv_taille_pc';}}
  function tzLit(){var v=1;try{v=parseFloat(localStorage.getItem(tzCle())||localStorage.getItem('lv_taille'))||1;}catch(e){}return v;}
  function tzApplique(v){document.documentElement.style.setProperty('--lvz',v);}
  /* application au chargement : sans elle, la taille choisie ailleurs resterait
     sans effet sur cette page tant qu'on n'aurait pas retouché A+ ou A−. */
  tzApplique(tzLit());
  document.addEventListener('click',function(e){
    var b=e.target.closest?e.target.closest('.ttx-b'):null;
    if(!b)return;
    var d=b.getAttribute('data-ttx'),v=tzLit();
    if(d==='0')v=1;
    else{var i=TZ.indexOf(v);if(i<0){i=2;}i+=(d==='1'?1:-1);i=Math.max(0,Math.min(TZ.length-1,i));v=TZ[i];}
    try{localStorage.setItem(tzCle(),String(v));}catch(e2){}
    tzApplique(v);
  });
})();
(function(){
  function obCle(){try{return (window.matchMedia&&(matchMedia('(pointer:coarse)').matches||matchMedia('(max-width:720px)').matches))?'lv_onglet_bible_mobile':'lv_onglet_bible_pc';}catch(e){return 'lv_onglet_bible_pc';}}
  function obMasque(){try{return localStorage.getItem(obCle())==='0';}catch(e){return false;}}
  var sw=document.getElementById('tog-bible');
  function etat(){if(sw)sw.classList.toggle('on',!obMasque());}
  etat();
  window.addEventListener('resize',etat);
  if(sw){
    var bascule=function(){var m=obMasque();try{localStorage.setItem(obCle(),m?'1':'0');}catch(e){}etat();try{window.dispatchEvent(new Event('resize'));}catch(e2){}};
    sw.addEventListener('click',bascule);
    sw.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();bascule();}});
  }
})();
</script>
