# Le robot du coffre R2. Claude ne peut pas joindre Cloudflare depuis son
# espace de travail : il passe par GitHub, et ce robot fait le lien.
# · Une branche « envoi/… » porte un dossier envoi/ (envoi.json et les
#   fichiers) : le robot range les cours d'Étude dans cours/ et les articles
#   dans articles/, une fois vérifiés contre le sommaire des cours et le
#   catalogue des articles que porte la branche, puis supprime la branche.
# · Une branche « demande/… » porte demande/demande.json : le robot cherche
#   les fichiers demandés dans le coffre et les dépose dans recu/, sur la
#   même branche, pour que Claude les lise et les modifie.
# Le mode d'emploi est dans documentation/donnees.md.
name: Coffre R2

on:
  push:
    branches: ['envoi/**', 'demande/**']

permissions:
  contents: write

concurrency:
  group: coffre-${{ github.ref_name }}
  cancel-in-progress: false

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  AWS_DEFAULT_REGION: auto
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

jobs:
  envoi:
    if: startsWith(github.ref_name, 'envoi/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Envoyer les fichiers dans le coffre
        run: python3 .github/coffre/envoi.py
      - name: Supprimer la branche d'envoi
        run: git push origin --delete "${GITHUB_REF_NAME}"

  demande:
    if: startsWith(github.ref_name, 'demande/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Chercher les pages demandées
        run: python3 .github/coffre/demande.py
      - name: Les déposer sur la branche
        run: |
          git config user.name "Robot du coffre"
          git config user.email "robot-coffre@users.noreply.github.com"
          git add recu
          git commit -m "Pages tirées du coffre R2 pour ${GITHUB_REF_NAME}" || echo "Rien à déposer"
          git push origin "HEAD:${GITHUB_REF_NAME}"
